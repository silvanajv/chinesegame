.save.ok{background:var(--good-bg);color:var(--good)}.save.warn{background:var(--warn-bg);color:var(--warn)}.save.bad{background:var(--bad-bg);color:var(--bad)}.save.wait{background:var(--soft);color:var(--muted)}

.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 18px;font-weight:700}
.primary.big{padding:15px;font-size:1.1rem;width:100%}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:600}
.ghost:disabled,.primary:disabled{opacity:.45;cursor:default}
.sm{padding:5px 10px;font-size:.85rem;border-radius:9px}
.danger{background:var(--bad);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:700}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}

.chip b{color:var(--muted);margin-right:2px}

.resume{background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.note{color:var(--muted);font-size:.85rem}

.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.cnt,.xp{font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.ex{display:flex;flex-direction:column;gap:14px}
.exhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.kind{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--seal)}
.stchip{font-family:var(--f-zh);font-size:1rem;display:flex;gap:6px;align-items:center}
.instr{margin:0;font-size:1.05rem}
.audio{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:10px 12px}
.audio .play{background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:10px 18px;font-weight:700}
.audio label{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.audio select,.msel select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 6px;max-width:220px}
.warn{color:var(--warn);font-size:.85rem;margin:0}
.reveal{min-height:1em}

.opt.right{border-color:var(--good);background:var(--good-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}

code{font-family:var(--f-py);background:var(--soft);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

let VALID_HZ=new Set(),VALID_PY=new Set(),STATEMENTS=[],EX_CACHE={};
const EXTRA_HZ=new Set(['你呢','您呢','謝謝','謝謝你','你好','您好','好久不見','啊','我也是','我也很好','好']);
let EXTRA_PY=new Set();
const FORMS=[{neg:false,q:''},{neg:true,q:''},{neg:false,q:'ma'},{neg:true,q:'ma'},{neg:false,q:'anb'},{neg:false,q:'wh'},{neg:true,q:'wh'}];
function formOk(st,f){if(f.neg&&!st.forms.neg)return false;if(f.q&&!st.forms[f.q])return false;if(f.neg&&f.q==='wh'&&st.id!=='you')return false;return true;}
function cartesian(slots){let out=[{}];for(const k in slots){const n=[];for(const o of out)for(const v of slots[k])n.push({...o,[k]:v});out=n;}return out;}
function stValid(st,p){if(st.valid&&!st.valid(p))return false;if(p.q==='wh'&&st.whFilter&&!st.whFilter(p[st.whSlot]))return false;return true;}
function subjOf(p){return p.subj||p.w;}
function variants(r,sa){const all=[r.toks,...(r.alts||[])];const out=[];all.forEach(t=>{out.push(t);if(sa&&t[0]===sa&&t.length>2)out.push(t.slice(1));});return out;}
function eachRender(st,fn){if(st.meta)return;
  if(st.id==='ne'){cartesian(st.slots).forEach(p=>{p.q='ne';fn(st.render(p),p);});return;}
  cartesian(st.slots).forEach(p0=>FORMS.forEach(f=>{const p={...p0,...f};if(!formOk(st,f)||!stValid(st,p))return;fn(st.render(p),p);}));}
function injectUserWords(entries){for(const k in BASE_SLOTS){SL[k].length=0;SL[k].push(...BASE_SLOTS[k]);}
  entries.forEach(e=>{const u={user:1};
    if(e.cat==='Sustantivo (objeto)'){SL.OBJ.push(mk(e.hz,e.es,{esN:e.es,...u}));SL.THIS.push(mk(e.hz,e.es,{w:'這',...u}));SL.YAO_VO.push(mkT(['買',e.hz],'comprar '+e.es,u));}
    else if(e.cat==='País/lugar'&&[...e.hz].length>=2){SL.COUNTRY.push(mk(e.hz,e.es,u));}
    else if(e.cat==='Idioma'){SL.LANG.push(mk(e.hz,e.es,u));}
    else if(e.cat==='Apellido'&&[...e.hz].length===1){SL.SURN.push(mk(e.hz,e.es,u));}});
  S.dong.slots.l2=[null,...SL.LANG];S.you.slots.o2=[null,...SL.OBJ];S.zhe.slots.x=[...SL.THIS,...SL.TITLES];}
function rebuildIndex(bank){
  PY={};ENTRY={};bank.forEach(e=>{if(!PY[e.hz])PY[e.hz]=e.py;if(!ENTRY[e.hz])ENTRY[e.hz]=e;});
  Object.assign(PY,EXTRA_TOK);SL.NAMES.forEach(n=>PY[n.hz]=n.py);
  DICT=new Set(Object.keys(PY));KNOWN_CH=new Set();Object.keys(PY).forEach(k=>[...k].forEach(c=>KNOWN_CH.add(c)));
  injectUserWords(bank.filter(e=>e.src==='tú'));
  VALID_HZ=new Set();VALID_PY=new Set();STATEMENTS=[];EX_CACHE={};
  for(const id in S){const st=S[id];eachRender(st,(r,p)=>{variants(r,subjOf(p)).forEach(t=>{VALID_HZ.add(normHz(t.join('')));VALID_PY.add(compactPy(sentPy(t,1)));});
    if(!p.q&&!p.neg)STATEMENTS.push(r);});}
  EXTRA_PY=new Set([...EXTRA_HZ].map(h=>compactPy(sentPy(tokenize(h),1))));}
function exampleFor(hz){if(EX_CACHE[hz]!==undefined)return EX_CACHE[hz];let best=null;
  for(const r of STATEMENTS){const s=r.toks.join('');if(s.includes(hz)&&s.replace(/[。？]/,'')!==hz&&(!best||s.length<best.toks.join('').length))best=r;}
  return EX_CACHE[hz]=best;}

/* ---------- 6. RESPUESTAS ACEPTADAS ---------- */
function mkAns(list,free){const acc=new Set(),accPy=new Set(),arr=[],pyMap=new Map();
  list.forEach(a=>variants(a,a.sa).forEach(t=>{const h=normHz(t.join(''));if(!acc.has(h)){acc.add(h);arr.push(t);}const c=compactPy(sentPy(t,1));accPy.add(c);if(!pyMap.has(c))pyMap.set(c,[sentPy(t),sentPy(t,1)]);}));
  return {list,acc,accPy,arr,pyMap,free:free||[]};}
function slotKey(st){return st.slots.subj?'subj':(st.slots.w?'w':null);}
function answersFor(st,p){
  if(st.id==='ne')return neAnswers(p);
  const key=slotKey(st),sa=mapA(p[key]);const base={...p,q:'',neg:false,[key]:sa};const out=[];const free=[];
  if(p.q==='wh'){const wn=st.id==='you'&&p.neg;
    for(const v of st.slots[st.whSlot]){if(v==null)continue;if(st.whFilter&&!st.whFilter(v))continue;const bp={...base,[st.whSlot]:v,neg:wn};if(st.valid&&!st.valid(bp))continue;out.push({...st.render(bp),pol:'+',sa});
      if(st.id==='you'&&!wn)for(const v2 of st.slots.o2){if(!v2||v2===v)continue;out.push({...st.render({...bp,o2:v2}),pol:'+',sa,extra:1});}
      if(st.id==='dong')for(const v2 of st.slots.l2){if(!v2||v2===v)continue;out.push({...st.render({...bp,l2:v2}),pol:'+',sa,extra:1});}}
    if(st.shortWh)for(const v of st.slots[st.whSlot]){if(v==null)continue;if(st.whFilter&&!st.whFilter(v))continue;const bp={...base,[st.whSlot]:v};if(st.valid&&!st.valid(bp))continue;out.push({toks:[...st.shortWh(bp),'。'],es:'',pol:'+',short:1});}
    if(st.id==='jiao')free.push({hz:new RegExp('^('+sa+')?叫[\\u3400-\\u9fff]{2,4}$'),py:new RegExp('^('+compactPy(tokPy(sa))+')?jiao[a-z]{2,16}$')});
  }else{const aff=st.render(base),neg=st.render({...base,neg:true});out.push({...aff,pol:'+',sa},{...neg,pol:'-',sa});
    const Y=st.yes(base),N=st.no(base);
    out.push({toks:[...Y,'。'],es:'Sí.',pol:'+',short:1},{toks:[...N,'。'],es:'No.',pol:'-',short:1},
      {toks:[...Y,'，',...aff.toks],es:'Sí. '+aff.es,pol:'+',alts:(aff.alts||[]).map(a=>[...Y,'，',...a]),sa:null},
      {toks:[...N,'，',...neg.toks],es:'No. '+neg.es,pol:'-',alts:(neg.alts||[]).map(a=>[...N,'，',...a])});
    if(st.whSlot&&p[st.whSlot])for(const v of st.slots[st.whSlot]){if(!v||v===p[st.whSlot])continue;const bp={...base,[st.whSlot]:v};if(!stValid(st,bp))continue;const r=st.render(bp);out.push({toks:[...N,'，',...r.toks],es:'No. '+r.es,pol:'-',extra:1});}}
  return mkAns(out,free);}
function neAnswers(p){const st=S[p.base.sid];const sa=mapA(p.who.hz);const bp={...p.base.p,subj:sa};const aff=st.render(bp),neg=st.render({...bp,neg:true});

const Q_SUBJ=['你','你','你','你','您','你們','他','她'];

function segAccept(s,first,rest){const a=[...s],n=a.length;const reach=new Array(n+1).fill(false);
  for(let i=1;i<=n;i++)if(first(a.slice(0,i).join('')))reach[i]=true;
  for(let i=1;i<n;i++){if(!reach[i])continue;for(let j=i+1;j<=n;j++)if(!reach[j]&&rest(a.slice(i,j).join('')))reach[j]=true;}return reach[n];}

function evalHz(A,raw,strict){const tags=[];const {s,found}=toTrad(raw);

    if([...th].length===[...n].length){const a=[...n],b=[...th];const d=a.map((c,i)=>c!==b[i]?c+' → '+b[i]:null).filter(Boolean);tags.push({t:'char',m:'Mismo sonido, carácter distinto: '+d.join(', ')+'.'});return {v:'partial',tags,corr:tgt,input:n};}}
  const ut=tokenize(n),bt=tokenize(bh);
  const us=ut.slice().sort().join();const perm=A.arr.find(t=>{const tt=tokenize(normHz(tj(t)));return tt.length===ut.length&&tt.slice().sort().join()===us;});
  if(perm){best=perm;}
  if(perm&&n!==normHz(tj(perm))){tags.push({t:'gram',m:'Las palabras son correctas, pero el orden no sigue la estructura.'});return {v:'partial',tags,corr:best,input:n};}
  if(VALID_HZ.has(n)){tags.push({t:'comp',m:'Tu oración es correcta, pero no responde a lo que se pedía.'});return {v:'partial',tags,corr:best,input:n};}
  if(ut.length===bt.length){const dif=ut.map((x,i)=>x!==bt[i]?i:-1).filter(i=>i>=0);if(dif.length===1){const u=ut[dif[0]],c=bt[dif[0]];if(DICT.has(u)){const neg=['不','沒','沒有','有'];

  const unknown=[...n].some(c=>!KNOWN_CH.has(c));const ratio=bd/Math.max([...n].length,[...bh].length);
  if(unknown&&!strict){tags.push({t:'info',m:'Usaste caracteres que no están en tu banco; no puedo comprobarlos con reglas.'});return {v:'review',tags,corr:best,input:n,unknown};}
  if(ratio<=0.34){if(!tags.some(t=>t.t!=='char'))tags.push({t:'gram',m:'Casi. Compara tu respuesta con la corrección.'});return {v:'partial',tags,corr:best,input:n};}

function evalPy(A,raw,strict){const tags=[];const c=compactPy(raw);if(!c)return {v:'empty'};

  let ok=first(c);if(!ok){const parts=raw.split(/[,.!?，。！？;；]+/).map(compactPy).filter(Boolean);if(parts.length>1&&first(parts[0])&&parts.slice(1).every(rest))ok=true;}

      if(us!==String(toneSeq(sand))&&us!==String(toneSeq(plain))){tags.push({t:'py',m:'Revisa los tonos: se escribe '+sand.replace(/[.?!,]+$/,'')+'.'});tone='bad';}}

function evaluate(ex,input,method){const a=ex.answer;

    else if(o.rule&&RULEMSG[o.rule])tags.push({t:RULEMSG[o.rule].t,m:'Ese cambio produce un error: '+RULEMSG[o.rule].m});
    else if(o.unchanged)tags.push({t:'comp',m:'Esa es la oración original: falta hacer el cambio.'});

function chip(g,p,m){return `<div class="chip"><span class="g">${g}</span><span class="t"><b>${p}</b><span>${m}</span></span></div>`;}

// ================= GAME =================
function start(l){
  const cards=l.build();cards.forEach(c=>{c.streak=0;c.done=false;c.seen=false;});
  G={l,cards,keys:new Set(cards.map(c=>c.key)),T:SP().start-(l.exam?500:0),pyOnly:!!l.exam&&save.examMode!=='meaning',phase:l.learn?'learn':'speed',
     queue:l.learn?cards.slice():shuffle(cards),learnI:0,mastered:0,first:0,miss:{},t0:performance.now(),lock:true};
  if(l.learn)shell();else{G.phase='speed';shell();}
  setTimeout(next,250);
}
function shell(){
  const sp=G.phase==='speed';
  app.innerHTML=`<div class="screen play">
    <div class="hud"><button class="back" id="bk" aria-label="Salir">✕</button><button class="back" id="pz" aria-label="Pausa">❚❚</button><span class="ln">${G.l.name}</span>
      <span class="phase">${sp?'Ronda rápida':'Aprender'}</span><span class="stat" id="st"></span></div>
    <div class="prog"><i id="pg"></i></div>
    <div class="stage" id="stg"></div>
    <div class="timer" id="tm" ${sp?'':'hidden'}><i id="tb"></i></div>
    <div class="opts" id="op"></div>
    <button class="primary" id="cont" hidden data-enter>Siguiente →</button>
    <div class="pausep" id="pp" hidden><div class="label">En pausa</div><p>Toma tus notas con calma. El reloj está detenido.</p><div id="peek"></div>
      <div class="row"><button class="secondary" id="pk">Ver respuesta</button><button class="primary" id="rs" data-enter>Continuar</button></div></div></div>`;
  $('bk').onclick=home;$('pz').onclick=()=>G&&(G.paused?resume():pause());$('rs').onclick=resume;$('pk').onclick=peek;$('cont').onclick=()=>{if(G&&G.waiting){G.waiting=false;next();}};
  hud();
}
function hud(){
  if(!G)return;const n=G.cards.length;
  if(G.phase==='learn'){$('st').innerHTML=`<b>${Math.min(G.learnI,n)}</b>/${n}`;$('pg').style.width=(G.learnI/n*100)+'%';}
  else{$('st').innerHTML=`<b>${G.mastered}</b>/${n} · <b>${(G.T/1000).toFixed(1)}</b> s`;$('pg').style.width=(G.mastered/n*100)+'%';}
}
function pause(){
  if(!G||G.paused)return;G.paused=true;
  if(G.phase==='speed'&&!G.lock){G.pausedRem=G.deadline-performance.now();stopTimer();}
  G.contWas=!$('cont').hidden;
  $('op').hidden=true;$('tm').hidden=true;$('cont').hidden=true;
  $('peek').innerHTML='';$('pk').hidden=G.lock;$('pp').hidden=false;$('pz').textContent='▶';
}
function peek(){
  const c=G&&G.card;if(!c||G.lock)return;G.peeked=true;$('pk').hidden=true;
  const main=c.kind==='id'?`<span class="han">${c.q}</span> lleva <span class="han">${c.top}</span> · ${c.sub}`:`<span class="han">${c.q}</span> <span class="py">${c.top}</span> · ${c.sub}`;
  $('peek').innerHTML=`<div class="reveal"><div class="main">${main}</div>${hints(c).map(h=>`<div class="h">${h}</div>`).join('')}<div class="h">Esta tarjeta volverá más adelante, sin contar como error.</div></div>`;
}
function resume(){
  if(!G||!G.paused)return;G.paused=false;
  $('pp').hidden=true;$('op').hidden=false;$('tm').hidden=G.phase!=='speed';$('cont').hidden=!G.contWas;$('pz').textContent='❚❚';
  if(G.peeked&&!G.lock){G.peeked=false;G.lock=true;G.pausedRem=null;G.queue.splice(Math.min(G.queue.length,3),0,G.card);next();return;}
  if(G.pendingNext){G.pendingNext=false;next();return;}
  if(G.phase==='speed'&&!G.lock&&G.pausedRem!=null){G.deadline=performance.now()+G.pausedRem;G.pausedRem=null;tick();}
}
function next(){
  if(!G)return;
  if(G.paused){G.pendingNext=true;return;}
  if(!G.queue.length){
    if(G.phase==='learn')return interstitial();
    return finish();
  }
  const c=G.card=G.queue.shift();
  const canRev=G.phase==='speed'&&(c.kind==='char'||c.kind==='word');
  G.rev=canRev&&!G.pyOnly&&Math.random()<(G.l.exam?.3:.35);
  G.opts=makeOpts(c,G.rev);
  const stg=$('stg');stg.className='stage';
  const prompt=G.rev?(c.kind==='word'?'¿Cuál es la palabra?':'¿Cuál es el carácter?'):
    c.kind==='rad'?'¿Qué significa este radical?':c.kind==='id'?'¿Qué radical lleva?':c.kind==='word'?'¿Qué palabra es?':'¿Qué carácter es?';
  const chars=[...c.q];
  stg.innerHTML=`<div class="prompt">${prompt}</div>`+(G.rev
    ?`<div class="revq"><div class="bigpy">${c.top}</div><div class="revsub">${c.sub}</div></div>`
    :`<div class="cells${chars.length>1?' two':''}">${chars.map(ch=>`<div class="cell"><span class="glyph">${ch}</span></div>`).join('')}</div>`)
    +`<div class="toast" id="to"></div>`;
  $('op').innerHTML=G.opts.map((o,i)=>{
    const top=G.rev?`<span class="top hanopt solo">${o.q}</span>`
      :c.kind==='id'?`<span class="top hanopt">${o.top}</span><span class="sub">${o.sub}</span>`
      :G.pyOnly?`<span class="top pyonly">${o.top}</span>`
      :`<span class="top">${o.top}</span><span class="sub">${o.sub}</span>`;
    return `<button class="opt" data-i="${i}"><span class="k">${i+1}</span>${top}</button>`;}).join('');
  SR.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  $('cont').hidden=true;G.waiting=false;G.lock=false;
  hud();
  if(G.phase==='speed'){
    G.dur=G.T+(c.kind==='word'?400:0)+(c.kind==='id'?500:0)+(G.rev?300:0);
    G.deadline=performance.now()+G.dur;tick();
  }
}
function makeOpts(c,rev){
  let cands;
  if(c.kind==='rad')cands=RAD.map(([g,p,m])=>({key:'rad:'+g,q:g,top:p,sub:m}));
  else if(c.kind==='id')cands=Object.entries(RADOPTS).map(([t,s])=>({key:'r:'+t,q:t,top:t,sub:s}));
  else if(c.kind==='word')cands=WORDS.map(w=>wordCard(w[0]));
  else cands=ALL.map(x=>charCard(x[0]));
  const conf=c.kind==='char'?confOf(c.q):new Set();const pp=plain(c.top);
  const scored=[];
  for(const o of cands){
    if(c.kind==='id'?o.top===c.top:o.q===c.q)continue;
    if(!rev&&o.sub===c.sub)continue;
    if(G.pyOnly&&o.top===c.top)continue;
    let s=Math.random()*1.2;
    if(G.keys.has(o.key))s+=1;
    if(c.kind==='char'){if(conf.has(o.q))s+=rev?3:1.2;if(plain(o.top)===pp)s+=rev?1:3;}
    if(c.kind==='word'&&[...o.q].some(ch=>c.q.includes(ch)))s+=2.5;
    if(c.kind==='id'&&(c.top==='日'&&o.top==='目'||c.top==='目'&&o.top==='日'))s+=3;
    scored.push([s,o]);
  }
  scored.sort((a,b)=>b[0]-a[0]);
  const ex=G.pyOnly;const kf=o=>rev?o.q:ex?o.top:o.sub;
  const picks=[];const seen=new Set([kf(c)]);
  for(const [,o] of scored){const k=kf(o);if(seen.has(k))continue;seen.add(k);picks.push(o);if(picks.length===3)break;}
  return shuffle([{...c,ok:true},...picks]);
}
let raf=0;
function tick(){
  if(!G||G.lock||G.paused||G.phase!=='speed')return;
  const rem=G.deadline-performance.now();const f=Math.max(0,rem/G.dur);
  const tb=$('tb');if(tb)tb.style.transform=`scaleX(${f})`;
  const tm=$('tm');if(tm)tm.classList.toggle('low',f<.35);
  if(rem<=0)return answer(null);
  raf=requestAnimationFrame(tick);
}
function stopTimer(){cancelAnimationFrame(raf);}
function hints(c){
  const h=[];
  if(c.kind==='char'){
    for(const r in IDS)if(IDS[r].includes(c.q))h.push(`Radical <span class="han">${r}</span> · ${RADOPTS[r]}`);
    const ws=WORDS.filter(w=>w[0].includes(c.q)).slice(0,2).map(w=>`<span class="han">${w[0]}</span> ${w[1]} · ${w[2]}`);
    if(ws.length)h.push('En: '+ws.join(' / '));
    const cf=[...confOf(c.q)].filter(x=>A[x]).slice(0,3);
    if(cf.length)h.push('No confundir con: '+cf.map(x=>`<span class="han">${x}</span> ${A[x].p}`).join(', '));
  }else if(c.kind==='word'){
    h.push([...c.q].map(ch=>A[ch]?`<span class="han">${ch}</span> ${A[ch].m}`:ch).join(' + '));
  }else if(c.kind==='id'){
    if(A[c.q])h.push(`<span class="han">${c.q}</span> ${A[c.q].p} · ${A[c.q].m}`);
  }
  return h;
}
function recordMiss(c){G.miss[c.key]=G.miss[c.key]||{c,n:0};G.miss[c.key].n++;}
function answer(i){
  if(!G||G.lock||G.paused)return;G.lock=true;stopTimer();
  const c=G.card;const btns=SR.querySelectorAll('.opt');btns.forEach(b=>b.disabled=true);
  const ri=G.opts.findIndex(o=>o.ok);const ok=i===ri;const stg=$('stg');
  if(i!=null&&!ok)btns[i].classList.add('wrong');btns[ri].classList.add('right');
  stg.classList.add(ok?'ok':'no');

  if(G.phase==='learn'){
    G.learnI++;
    if(ok)c.streak=1;else{c.streak=0;recordMiss(c);}
    stg.classList.add('revealed');
    const main=c.kind==='id'
      ?`<span class="han">${c.q}</span> lleva <span class="han">${c.top}</span> · ${c.sub}`
      :`<span class="han">${c.q}</span> <span class="py">${c.top}</span> · ${c.sub}`;
    const rv=document.createElement('div');rv.className='reveal';
    rv.innerHTML=`<div class="main">${main}</div>${hints(c).map(h=>`<div class="h">${h}</div>`).join('')}`;
    stg.insertBefore(rv,$('to'));
    $('cont').hidden=false;G.waiting=true;hud();
    return;
  }

  // speed phase
  const firstTime=!c.seen;c.seen=true;
  if(ok){
    if(firstTime)G.first++;
    c.streak++;G.T=Math.max(SP().min,G.T-150);
    if(c.streak>=G.l.need){c.done=true;G.mastered++;}
    else G.queue.splice(Math.min(G.queue.length,5+(Math.random()*4|0)),0,c);
    hud();setTimeout(next,240);
  }else{
    c.streak=0;recordMiss(c);G.T=Math.min(SP().max,G.T+SP().pen);
    G.queue.splice(Math.min(G.queue.length,3),0,c);
    const to=$('to');
    const ans=c.kind==='id'?`<span class="han">${c.top}</span> ${c.sub}`:`<span class="han">${c.q}</span> ${c.top} · ${c.sub}`;
    to.innerHTML=(i==null?'⏱ ':'')+ans;to.className='toast on';
    hud();setTimeout(next,1300);
  }
}
function interstitial(){
  stopTimer();G.lock=true;
  const n=G.cards.length;const got=G.cards.filter(c=>c.streak>0).length;
  app.innerHTML=`<div class="screen inter">
    <div class="big">快</div><h2>Ahora, la ronda rápida</h2>
    <p class="lead">Acertaste ${got} de ${n} en la ronda de aprendizaje.</p>
    <ul class="steps">
      <li>Empiezas con <b>${(G.T/1000).toFixed(1)} s</b> por carácter. Cada acierto baja el tiempo y cada fallo lo sube.</li>
      <li>${G.l.rad?'':'Algunas preguntas van al revés: ves el pinyin y eliges el carácter. '}Las opciones incluyen caracteres que se parecen.</li>

    </ul>

  $('go').onclick=()=>{G.phase='speed';G.queue=shuffle(G.cards.filter(c=>!c.done));shell();setTimeout(next,250);};
}
function finish(){
  stopTimer();
  const l=G.l;const n=G.cards.length;const time=performance.now()-G.t0;
  const acc=Math.round(G.first/n*100);
  const misses=Object.values(G.miss).sort((a,b)=>b.n-a.n);
  // weak list: add misses, clear clean ones
  for(const c of G.cards){if(c.kind!=='char'&&c.kind!=='word')continue;const m=G.miss[c.key];
    if(m)save.weak[c.key]=(save.weak[c.key]||0)+m.n;else delete save.weak[c.key];}
  if(!l.custom){
    const i=l.idx;const prev=save.best[i];
    save.best[i]={time:prev?Math.min(prev.time,time):time,acc:prev?Math.max(prev.acc,acc):acc};
    if(i<EXAM&&save.unlocked<i+1)save.unlocked=i+1;
  }
  persistS();
  const nextL=!l.custom&&l.idx<EXAM?LESSONS[l.idx+1]:null;
  const missCards=misses.map(m=>m.c);
  app.innerHTML=`<div class="screen results">
    <h2><span class="han">完成</span>${l.name}</h2>
    <div class="kpis"><div class="kpi"><b>${fmt(time)}</b><span>tiempo</span></div><div class="kpi"><b>${acc}%</b><span>a la primera (ronda rápida)</span></div><div class="kpi"><b>${(G.T/1000).toFixed(1)} s</b><span>velocidad final</span></div></div>
    ${misses.length?`<div class="group"><h3 class="label" style="margin:0 0 8px">Para repasar</h3><div class="chips">${misses.map(m=>chip(m.c.q,m.c.kind==='id'?m.c.top+' '+m.c.sub:m.c.top,(m.c.kind==='id'?'radical':m.c.sub)+' · ×'+m.n)).join('')}</div></div>`
      :`<div class="note">Sin errores en toda la lección.</div>`}
    <div class="row">
      ${misses.length?`<button class="secondary" id="pm">Practicar estos ${misses.length}</button>`:`<button class="secondary" id="again">Repetir</button>`}
      ${nextL?`<button class="primary" id="nx" data-enter>Siguiente: ${nextL.name}</button>`:`<button class="primary" id="hm2" data-enter>Volver a lecciones</button>`}
    </div>
    <button class="linkbtn" id="hm" style="align-self:flex-start">Volver a lecciones</button>
  </div>`;
  G=null;
  if($('pm'))$('pm').onclick=()=>preview(customLesson('Repaso: '+l.name,missCards));
  if($('again'))$('again').onclick=()=>start(l);
  if($('nx'))$('nx').onclick=()=>preview(nextL);
  if($('hm2'))$('hm2').onclick=home;
  $('hm').onclick=home;
}

function commit(score,self){const ex=UI.ex,SS=SESSION,method=P.prefs.method,hints=UI.hints;const free=ex.answer.type==='free';

  <nav>${[['home','Practicar'],['sprint','Sprint'],['bank','Banco'],['progress','Progreso']].map(([k,n])=>`<button data-act="nav" data-to="${k}" class="${UI.screen===k||(k==='home'&&['play','summary'].includes(UI.screen))?'on':''}">${n}</button>`).join('')}</nav>
  <div class="me"><span class="lvl">Nivel ${L}</span><span class="xpbar" title="${P.xp} XP"><i style="width:${Math.round((P.xp-a)/(b-a)*100)}%"></i></span><span id="save" class="save"></span></div></header>`;}
function render(){const app=$('#app');let h=header();
  if(UI.screen==='home')h+=homeView();else if(UI.screen==='play')h+=playView();else if(UI.screen==='summary')h+=summaryView();else if(UI.screen==='bank')h+=bankView();else if(UI.screen==='progress')h+=progressView();else if(UI.screen==='sprint')h+='<main class="wrap"><div id="sp-host"></div></main>';
  if(UI.screen!=='sprint')Sprint.stop();
  app.innerHTML=h+'<div id="flash" class="flash" hidden></div>';renderSave();if(UI.screen==='sprint')Sprint.open(document.getElementById('sp-host'));}

function homeView(){const sel=UI.sel,pf=P.prefs;
  const topicBtn=t=>`<button class="chip ${sel.type==='topic'&&sel.id===t.id?'on':''}" data-act="sel-topic" data-id="${t.id}"><b>${t.id}</b> ${esc(t.name)}</button>`;
  const resume=SESSION&&!SESSION.done&&SESSION.n>0?`<div class="resume">Tienes una sesión a medias (${SESSION.n} ejercicios). <button class="link" data-act="resume">Continuar</button> · <button class="link" data-act="end">Ver resumen</button></div>`:'';
  return `<main class="wrap home">${resume}
  <section><h1>¿Qué quieres practicar?</h1>
   <div class="chips">${TOPICS.map(topicBtn).join('')}<button class="chip ${sel.type==='all'?'on':''}" data-act="sel-all">Todos los temas</button></div>
   <button class="link" data-act="toggle-structs">${UI.showStructs||sel.type==='struct'?'Ocultar estructuras':'…o una estructura concreta'}</button>
   ${UI.showStructs||sel.type==='struct'?`<div class="structs">${STRUCT_ORDER.map(id=>`<button class="srow ${sel.type==='struct'&&sel.id===id?'on':''}" data-act="sel-struct" data-id="${id}"><span class="zh">${esc(S[id].name)}</span><span class="pat">${esc(S[id].pattern)}</span>${lvlPill(id)}</button>`).join('')}</div>`:''}
  </section>
  <section><h2>Modo</h2><div class="modes">${MODES.map(m=>`<button class="mode ${pf.mode===m.id?'on':''}" data-act="mode" data-id="${m.id}"><b>${m.name}</b><small>${m.d}</small></button>`).join('')}</div>
   ${pf.mode==='conv'?`<div class="chips sits"><span class="lbl">Situación</span><button class="chip ${UI.sit==='any'?'on':''}" data-act="sit" data-id="any">Sorpréndeme</button>${SITS.map(s=>`<button class="chip ${UI.sit===s.id?'on':''}" data-act="sit" data-id="${s.id}">${esc(s.name)}</button>`).join('')}</div>`:''}
  </section>
  <section><h2>Cómo respondes</h2><div class="seg4">${METHODS.map(m=>`<button class="${pf.method===m.id?'on':''}" data-act="method" data-id="${m.id}"><b>${m.name}</b><small>${m.d}</small></button>`).join('')}</div>
   <div class="row"><span class="lbl">Ejercicios por sesión</span>${[8,12,20].map(n=>`<button class="chip sm ${pf.goal===n?'on':''}" data-act="goal" data-n="${n}">${n}</button>`).join('')}</div>
  </section>
  <button class="primary big" data-act="start">Empezar</button>
  ${!TTS?'<p class="note">Este navegador no tiene síntesis de voz: los ejercicios de escucha mostrarán el texto.</p>':''}
  </main>`;}

function playView(){const ex=UI.ex,SS=SESSION;if(!ex)return '<main class="wrap"></main>';const done=!!UI.res;const pct=Math.min(100,Math.round(SS.n/SS.goal*100));
  const stId=ex.st?ex.st.id:null;const head=ex.kind==='vocab'?'Vocabulario':esc(ex.st.name);
  return `<main class="wrap play">
  <div class="ptop"><button class="ghost" data-act="end">Terminar</button><div class="bar"><i style="width:${pct}%"></i></div><span class="cnt">${SS.n}/${SS.goal}</span><span class="xp">+${SS.xp} XP</span></div>
  <section class="card ex">
   <div class="exhead"><span class="kind">${KIND_LABEL[ex.kind]}</span><span class="stchip">${head}${stId?' '+lvlPill(stId):''}</span></div>
   <p class="instr">${esc(ex.instr)}${ex.task?` <b>${esc(ex.task)}</b>`:''}</p>
   ${promptHtml(ex)}
   ${answerHtml(ex)}
   ${hintsHtml(ex)}
   ${done?'':`<div class="actions"><button class="ghost" data-act="hint" ${UI.hints>=hintCount(ex)?'disabled':''}>Pista ${Math.min(UI.hints+1,hintCount(ex))}/${hintCount(ex)}</button>
     ${ex.answer.type==='free'||ex.kind!=='vocab'?`<label class="msel">Responder con <select data-act="method-change">${METHODS.map(m=>`<option value="${m.id}" ${P.prefs.method===m.id?'selected':''}>${m.name}</option>`).join('')}</select></label>`:''}
     <button class="primary" data-act="check">Comprobar</button></div>`}
   ${done?feedbackHtml(ex):''}
  </section></main>`;}
function hintCount(ex){return ex.hints.filter(Boolean).length;}
function hintsHtml(ex){if(!UI.hints)return '';return `<ol class="hints">${ex.hints.filter(Boolean).slice(0,UI.hints).map(h=>`<li>${esc(h)}</li>`).join('')}</ol>`;}
function audioBar(ex){const v=voice();const rates=[0.6,0.75,0.85,1,1.2];
  return `<div class="audio"><button class="play" data-act="play" aria-label="Escuchar">▶ Escuchar</button><span class="muted">Reproducciones: <b id="plays">${UI.plays}</b></span>
  <label>Velocidad <select data-act="rate">${rates.map(r=>`<option value="${r}" ${Math.abs((P.prefs.rate||.85)-r)<.01?'selected':''}>${r}×</option>`).join('')}</select></label>
  ${VOICES.length>1?`<label>Voz <select data-act="voice">${VOICES.map(x=>`<option value="${esc(x.voiceURI)}" ${v&&v.voiceURI===x.voiceURI?'selected':''}>${esc(x.name)} (${esc(x.lang)})</option>`).join('')}</select></label>`:''}</div>
  ${!TTS?'<p class="warn">Tu navegador no tiene voz. Usa “Mostrar pregunta escrita”.</p>':!VOICES.length?'<p class="warn">No encuentro una voz china instalada; puede sonar mal o no sonar. Instala “Chino (Taiwán)” en los ajustes de voz de tu sistema, o muestra la pregunta escrita.</p>':(!/TW|Hant|Taiwan/i.test(v.lang+v.name)?'<p class="muted small">No hay voz de Taiwán (zh-TW) instalada; uso '+esc(v.name)+'.</p>':'')}`;}
function promptHtml(ex){let h='';
  if(ex.kind==='listen'||ex.kind==='conv'){h+=audioBar(ex);
    if(UI.revealed||!TTS){h+=`<div class="qtext"><span class="zh big">${esc(tj(ex.audio))}</span>${UI.revealed>1?`<div class="py">${esc(sentPy(ex.audio))}</div>`:''}</div>`;}
    if(!UI.res)h+=`<div class="reveal">${UI.revealed<1&&TTS?'<button class="link" data-act="reveal">Mostrar pregunta escrita</button>':''}${UI.revealed===1?'<button class="link" data-act="reveal">Mostrar pinyin</button>':''}</div>`;}
  else if(ex.kind==='vocab'){const e=ex.entry;h+=ex.fmt==='hz'?`<div class="big1 zh">${esc(e.hz)}</div><button class="link" data-act="play">▶ Escuchar</button>`:`<div class="cue">${esc(e.es)}</div>`;}
  else{
    if(ex.question){h+=`<div class="qtext"><span class="zh big">${esc(tj(ex.question.toks))}</span> <button class="link" data-act="play">▶</button></div>`;}
    if(ex.base)h+=`<div class="basesent"><span class="lbl">Oración</span><span class="zh big">${esc(tj(ex.base.toks))}</span></div>`;
    if(ex.changes)h+=`<ul class="changes">${ex.changes.map(c=>`<li><span class="lbl">${esc(c.label)}</span> <span class="zh">${esc(c.from)}</span> → <b>${esc(c.to)}</b></li>`).join('')}</ul>`;
    if(ex.showPattern)h+=`<div class="pattern">${esc(ex.b.pattern)}</div>`;
    if(ex.cue)h+=`<div class="cue">${esc(ex.cue)}</div>`;
    if(ex.scrambled)h+=`<div class="scr">${ex.scrambled.map(t=>`<span class="zh">${esc(t)}</span>`).join('')}</div>`;}
  return h;}
function tileHtml(t,attr,cls){const e=ENTRY[t];const showPy=P.prefs.pyTiles||(e&&e.status==='nuevo');return `<button class="tile ${cls||''}" ${attr}><span class="zh">${esc(t)}</span>${showPy?`<small>${esc(tokPy(t))}</small>`:''}</button>`;}
function answerHtml(ex){const a=ex.answer,done=!!UI.res;
  if(a.type==='mc'){return `<div class="opts ${a.kind}">${a.opts.map((o,i)=>{let cls='';if(done){if(o.ok)cls='right';else if(UI.pick===i)cls='wrong';}else if(UI.pick===i)cls='sel';
    const body=a.kind==='es'?esc(o.es):a.kind==='desc'?esc(o.d):`<span class="zh">${esc(tj(o.toks||[]))}</span>`;
    return `<button class="opt ${cls}" data-act="opt" data-i="${i}" ${done?'disabled':''}><span class="k">${i+1}</span>${body}</button>`;}).join('')}</div>`;}
  const tpl=a.template;const m=P.prefs.method;
  if(m==='tiles'||m==='mc'){const T=UI.tiles;const built=T.sel.length?T.sel.map((pi,k)=>tileHtml(T.pool[pi].t,`data-act="btile" data-k="${k}" ${done?'disabled':''}`,UI.tSel===k?'focus':'')).join(''):'<span class="ph">Toca las fichas en orden</span>';
    return `<div class="build">${tpl?`<span class="zh big">${esc(tj(tpl.before))}</span>`:''}<div class="built">${built}</div>${tpl?`<span class="zh big">${esc(tj(tpl.after))}</span>`:''}</div>
     ${done?'':`<div class="tctl"><button class="ghost sm" data-act="tmove" data-d="-1" ${UI.tSel<0?'disabled':''}>◀ Mover</button><button class="ghost sm" data-act="tmove" data-d="1" ${UI.tSel<0?'disabled':''}>Mover ▶</button><button class="ghost sm" data-act="tdel" ${UI.tSel<0?'disabled':''}>Quitar</button><button class="ghost sm" data-act="tclear" ${T.sel.length?'':'disabled'}>Borrar todo</button></div>
     <div class="pool">${T.pool.map((x,i)=>x.used?'':tileHtml(x.t,`data-act="tile" data-i="${i}"`)).join('')}</div>`}`;}
  const ph=m==='pinyin'?(tpl?'la parte que falta, p. ej. hen':'p. ej. wo shi meiguo ren'):(tpl?'la parte que falta':'escribe en caracteres tradicionales');
  return `<div class="build">${tpl?`<span class="zh big">${esc(tj(tpl.before))}</span>`:''}<input id="ans" class="ans ${m==='hanzi'?'zh':''}" autocomplete="off" autocapitalize="off" spellcheck="false" ${m==='hanzi'?'lang="zh-Hant-TW"':''} placeholder="${ph}" ${done?'disabled':''} value="${done?esc(UI.lastTyped||''):''}">${tpl?`<span class="zh big">${esc(tj(tpl.after))}</span>`:''}</div>
   <p class="muted small">${m==='pinyin'?'Puedes escribir sin tonos, con tonos (nǐ) o con números (ni3). Los tonos se revisan aparte.':'Usa el teclado chino de tu sistema (pinyin o 注音). Si aún no lo usas, cambia a “Seleccionar caracteres”.'}</p>`;}
function feedbackHtml(ex){const r=UI.res;const v=r.v==='review'&&r.self!=null?(r.self?'ok':'bad'):r.v;
  if(v==='void')return `<div class="fb review"><div class="verdict">Ejercicio anulado</div><p>No cuenta para tu progreso. ${r.fixed==='pair'?'Esa combinación de pregunta y respuesta ya no volverá a salir.':'Esa oración ya no volverá a salir.'} Quedó guardado en <b>Progreso → Correcciones</b>.</p></div>`+nextBtns('void');
  const head={ok:'Correcto',partial:'Parcialmente correcto',bad:'Incorrecto',review:'No puedo evaluarla con reglas'}[v];
  let h=`<div class="fb ${v}"><div class="verdict">${head}${r.tone==='bad'&&v==='ok'?' · revisa los tonos':''}${r.gain?` <span class="gain">+${r.gain} XP</span>`:''}</div>`;
  if(r.newAch)h+=`<div class="ach-new">Logro desbloqueado: ${r.newAch.map(esc).join(', ')}</div>`;
  if(ex.kind==='vocab'){const e=ex.entry;const exm=e.ex?{toks:[e.ex],es:''}:exampleFor(e.hz);h+=`<div class="vocabfb"><span class="zh big">${esc(e.hz)}</span> <span class="py">${esc(e.py)}</span> · ${esc(e.es)} <span class="pill">${esc(e.cat)}</span>${exm?`<div class="muted">Ejemplo: <span class="zh">${esc(tj(exm.toks))}</span> ${esc(exm.es||'')}</div>`:''}</div></div>`+nextBtns(v);return h;}
  if(ex.review&&ex.review.q)h+=sentBlock(ex.review.q,'Pregunta');
  if(v!=='ok'||ex.kind==='listen'||ex.kind==='conv'||(ex.review&&ex.review.q)){h+=`<div class="yours"><span class="lbl">Tu respuesta</span> <span class="${ex.answer.kind==='es'||ex.answer.kind==='desc'||P.prefs.method==='pinyin'?'':'zh'}">${esc(r.inputShown)}</span></div>`;}
  if(r.v==='review'&&r.self==null)h+=`<p>Tu respuesta usa algo que mis reglas no pueden comprobar. Compárala con la respuesta modelo y decide tú:</p><div class="row"><button class="ghost" data-act="self" data-ok="1">Estaba bien</button><button class="ghost" data-act="self" data-ok="0">Estaba mal</button></div>`;
  const model=ex.answer.type==='mc'?answerOf(ex):(r.corr&&v!=='ok'?withEs(r.corr,ex):ex.review.a);
  if(ex.answer.kind==='desc'){h+=`<div class="sent"><div class="lbl">Cambio correcto</div><div>${esc(ex.answer.opts.find(o=>o.ok).d)}</div></div>`+sentBlock(ex.review.a,'Resultado');}
  else if(ex.answer.kind==='es'){h+=sentBlock(ex.review.a,'Una respuesta posible');}
  else if(v!=='ok'||ex.kind==='listen'||ex.kind==='conv'||ex.question)h+=sentBlock(model,v==='ok'?'Respuesta':'Corrección');
  if(r.tags&&r.tags.length)h+=`<ul class="tags">${r.tags.map(t=>`<li><span class="tag t-${t.t}">${TAGNAME[t.t]||t.t}</span> ${esc(t.m)}</li>`).join('')}</ul>`;
  if(v!=='ok'&&ex.b){const e2=otherExample(ex.b,model);if(e2)h+=`<div class="more"><span class="lbl">Otro ejemplo con ${esc(ex.b.pattern)}</span> <span class="zh">${esc(tj(e2.toks))}</span> <span class="py">${esc(sentPy(e2.toks))}</span> · ${esc(e2.es)}</div>`;}
  h+=fixPanel(ex,v);h+='</div>';return h+nextBtns(v);}
function fixPanel(ex,v){const r=UI.res;if(r.fixed)return r.fixed==='note'?'<p class="muted small">Nota guardada en Progreso → Correcciones.</p>':'';
  if(!UI.fixOpen)return `<button class="link small" data-act="fix-open">¿Algo está mal en este ejercicio?</button>`;
  const canAccept=v!=='ok'&&!(ex.answer.type==='mc'&&(ex.answer.kind==='desc'));
  return `<div class="fixp"><b>Corregir este ejercicio</b>
   ${canAccept?`<button class="ghost sm" data-act="fix" data-k="accept">Mi respuesta también es correcta</button><small class="muted">Se acepta desde ahora para esta misma pregunta y se recalifica como correcta.</small>`:''}
   ${ex.Q?`<button class="ghost sm" data-act="fix" data-k="pair">La pregunta y la respuesta no coinciden</button><small class="muted">Anula el ejercicio y esa combinación no vuelve a salir.</small>`:''}
   <button class="ghost sm" data-act="fix" data-k="sentence">${ex.Q?'La pregunta':'La oración'} está mal o no es natural</button><small class="muted">Anula el ejercicio y esa oración no vuelve a salir.</small>
   <textarea id="fixnote" rows="2" placeholder="Nota opcional: qué está mal o cómo debería ser"></textarea>
   <div class="row"><button class="ghost sm" data-act="fix" data-k="note">Solo guardar la nota</button><button class="link small" data-act="fix-close">Cancelar</button></div></div>`;}
function nextBtns(v){const SS=SESSION;if(v==='void')v='ok';const fin=SS.n>=SS.goal;return `<div class="actions">${v!=='ok'&&!UI.res.fixed?'<button class="ghost" data-act="repeat">Repetir este ejercicio</button>':''}${UI.res.v==='review'&&UI.res.self==null?'':`<button class="primary" id="nextbtn" data-act="${fin?'end':'next'}">${fin?'Ver resumen':'Siguiente →'}</button>`}${fin?'<button class="ghost" data-act="next">Seguir practicando</button>':''}</div>`;}
function answerOf(ex){const o=ex.answer.opts.find(x=>x.ok);if(ex.answer.kind==='word'&&ex.template)return {toks:[...ex.template.before,...o.toks,...ex.template.after],es:ex.cue||(ex.review.a&&ex.review.a.es)};if(ex.answer.kind==='word')return {toks:o.toks,es:o.es};return o.toks?{toks:o.toks,es:o.es}:ex.review.a;}
function withEs(toks,ex){const A=ex.answer.A;const h=normHz(tj(toks));const it=A.list.find(a=>variants(a,a.sa).some(t=>normHz(tj(t))===h));return {toks,es:it?it.es:''};}

function summaryView(){const SS=SESSION;if(!SS||!SS.n)return `<main class="wrap"><section class="card"><h1>Sin ejercicios todavía</h1><button class="primary" data-act="nav" data-to="home">Volver</button></section></main>`;
  const acc=Math.round(SS.sum/SS.n*100);const sids=Object.keys(SS.sids);
  const rows=sids.map(id=>{const s=SS.sids[id];const a=Math.round(s.c/s.a*100);const l0=SS.lvl0[id]||0,l1=levelOf(rec(id));return {id,a,s,l0,l1};});
  const review=rows.filter(r=>r.a<70||r.l1<2).sort((x,y)=>x.a-y.a);
  const mist=Object.values(SS.mistakes).sort((a,b)=>b.n-a.n);const rep=mist.filter(m=>m.n>=2);
  const ww=Object.entries(SS.wordsWrong).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const can=STRUCT_ORDER.filter(id=>levelOf(rec(id))>=2);const need=rows.filter(r=>r.l1<2).map(r=>r.id);
  const focus=suggestFocus(SS,rows,mist);
  const bank=fullBank();const newW=[...new Set([...SS.newSeen,...SS.added])].map(hz=>bank.find(e=>e.hz===hz)).filter(Boolean);
  return `<main class="wrap summary"><section class="card"><h1>Resumen de la sesión</h1>
  <div class="kpis"><div><b>${SS.n}</b><span>ejercicios</span></div><div><b>${acc}%</b><span>precisión</span></div><div><b>+${SS.xp}</b><span>XP</span></div></div>
  <h2>Estructuras practicadas</h2><div class="tblwrap"><table class="tbl"><tr><th>Estructura</th><th>Intentos</th><th>Precisión</th><th>Nivel</th></tr>${rows.map(r=>`<tr><td class="zh">${esc(S[r.id].name)}</td><td>${r.s.a}</td><td>${r.a}%</td><td>${r.l1!==r.l0?`<span class="pill l${r.l0}">${LEVELS[r.l0]}</span> → `:''}<span class="pill l${r.l1}">${LEVELS[r.l1]}</span></td></tr>`).join('')}</table></div>
  <div class="two">
   <div><h2>Ya puedes hacer sola</h2>${can.length?`<ul>${can.map(id=>`<li>${esc(S[id].cando)} <span class="zh muted">${esc(S[id].name)}</span></li>`).join('')}</ul>`:'<p class="muted">Todavía ninguna estructura en nivel Desarrollando. Llegan con aciertos sin pistas.</p>'}</div>
   <div><h2>Aún requiere práctica</h2>${need.length?`<ul>${need.map(id=>`<li>${esc(S[id].cando)} <span class="zh muted">${esc(S[id].name)}</span></li>`).join('')}</ul>`:'<p class="muted">Nada pendiente de lo que practicaste hoy.</p>'}</div></div>
  <h2>Errores repetidos</h2>${(rep.length?rep:mist.slice(0,3)).length?`<ul class="tags">${(rep.length?rep:mist.slice(0,3)).map(m=>`<li><span class="tag t-${m.t}">${TAGNAME[m.t]}</span> ${esc(m.m)} <span class="muted">×${m.n}${m.ex?' · <span class="zh">'+esc(m.ex)+'</span>':''}</span></li>`).join('')}</ul>`:'<p class="muted">Sin errores.</p>'}
  <div class="two"><div><h2>Estructuras para repasar</h2>${review.length?`<ul>${review.map(r=>`<li><span class="zh">${esc(S[r.id].name)}</span> · ${r.a}%</li>`).join('')}</ul>`:'<p class="muted">Ninguna.</p>'}</div>
  <div><h2>Palabras para repasar</h2>${ww.length?`<ul>${ww.map(([hz,n])=>{const e=bank.find(x=>x.hz===hz);return `<li><span class="zh">${esc(hz)}</span> ${e?esc(e.py)+' · '+esc(e.es):''} <span class="muted">×${n}</span></li>`;}).join('')}</ul>`:'<p class="muted">Ninguna.</p>'}</div></div>
  <h2>Vocabulario nuevo</h2>${newW.length?`<p>${newW.map(e=>`<span class="zh">${esc(e.hz)}</span> ${esc(e.py)} (${esc(e.es)})`).join(' · ')}</p>`:'<p class="muted">No apareció vocabulario nuevo.</p>'}
  <h2>Siguiente sesión</h2><p class="focus">${esc(focus)}</p>
  <div class="actions"><button class="primary" data-act="new-session">Nueva sesión</button>${SS.fails.length?`<button class="ghost" data-act="repeat-fails">Repetir los ${Math.min(SS.fails.length,10)} ejercicios difíciles</button>`:''}<button class="ghost" data-act="copy-summary">Copiar resumen</button><button class="ghost" data-act="dl-summary">Descargar resumen</button></div>
  </section></main>`;}
function suggestFocus(SS,rows,mist){const parts=[];const worst=rows.slice().sort((a,b)=>a.a-b.a)[0];
  if(worst&&worst.a<80)parts.push('Practica «'+S[worst.id].name+'» en modo '+(worst.l1<1?'Construir':'Transformar')+'.');
  const tc={};mist.forEach(m=>tc[m.t]=(tc[m.t]||0)+m.n);const top=Object.entries(tc).sort((a,b)=>b[1]-a[1])[0];
  if(top)parts.push({gram:'Fíjate en el orden y en las partículas (不/沒, 嗎, 也).',vocab:'Repasa el vocabulario de tu banco antes de empezar.',char:'Repasa los caracteres parecidos (他/她, 臺/台).',py:'Practica los tonos escribiendo pinyin con números.',nat:'Repasa las formas naturales: 你忙嗎, 太熱了.',comp:'Haz una sesión de Escuchar a velocidad 0.75×.'}[top[0]]||'');
  const acc=SS.sum/SS.n;const mi=METHODS.findIndex(m=>m.id===SS.method);
  if(acc>=0.85&&mi<3)parts.push('Vas bien con «'+METHODS[mi].name+'». Si te sientes cómoda, prueba «'+METHODS[mi+1].name+'».');
  if(!parts.length)parts.push('Prueba Práctica mixta con todos los temas para reciclar lo aprendido.');return parts.join(' ');}

/* ---------- 15. BANCO: AÑADIR, EXPORTAR, IMPORTAR ---------- */
const HAN=/^[㐀-鿿豈-﫿]+$/;
function matchCat(c){if(!c)return 'Otro';const t=toneless(c).trim();const f=CATS.find(x=>toneless(x)===t)||CATS.find(x=>toneless(x).startsWith(t.slice(0,5)));if(/objeto/.test(t))return 'Sustantivo (objeto)';return f||'Otro';}
function addEntries(list){const have=new Set(fullBank().map(e=>normHz(e.hz)));const added=[],dup=[],bad=[];
  list.forEach(x=>{const hz=toTrad((x.hz||'').trim()).s;const py=(x.py||'').trim(),es=(x.es||'').trim();
    if(!hz||!HAN.test(hz)||!py||!es){bad.push(x.raw||hz||'(vacía)');return;}
    if(have.has(normHz(hz))){dup.push(hz);return;}
    const e={hz,py,es,cat:matchCat(x.cat),ex:(x.ex||'').trim(),src:'tú',status:'nuevo',added:today()};B.added.push(e);have.add(normHz(hz));added.push(e);});
  if(added.length){P.cnt.added+=added.length;rebuildIndex(fullBank());if(SESSION)SESSION.added.push(...added.map(e=>e.hz));persist();}
  UI.lastAdded=added.map(e=>e.hz);
  UI.bankMsg=(added.length?`<b>Añadidas (${added.length}):</b> ${added.map(e=>`<span class="zh">${esc(e.hz)}</span> ${esc(e.py)} · ${esc(e.es)}`).join(' — ')}`:'<b>No se añadió nada.</b>')+
   (dup.length?`<br>Ya estaban en tu banco y no se modificaron: <span class="zh">${dup.map(esc).join('、')}</span>`:'')+(bad.length?`<br>Faltan datos (字, pinyin y español son obligatorios): ${bad.map(esc).join(' · ')}`:'')+(added.length?'<br>Están resaltadas en la tabla de abajo.':'');
  if(added.length){UI.bankQ='';UI.bankCat='';UI.bankStatus='';}render();}
function exportData(){return JSON.stringify({app:'shuoshuokan',v:1,at:new Date().toISOString(),bank:fullBank().map(e=>({hz:e.hz,py:e.py,es:e.es,cat:e.cat,ex:e.ex||'',status:e.status,src:e.src})),prog:P});}
async function download(name,text,mime){try{const d=window.claude&&await window.claude.use('downloads');if(!d){const u=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);flash('Archivo descargado.');return true;}await d.save({filename:name,data:new Blob([text],{type:mime||'text/plain'})});flash('Archivo listo.');return true;}catch(e){flash(e&&e.code==='declined'?'Descarga cancelada.':'No se pudo descargar. Usa “Copiar”.');return false;}}
async function copy(text,sel){try{await navigator.clipboard.writeText(text);flash('Copiado.');}catch(e){const el=sel&&document.querySelector(sel);if(el){el.focus();el.select();flash('Selecciona y copia con Ctrl/Cmd + C.');}else flash('No se pudo copiar.');}}
function doImport(text,mode){let d;try{d=JSON.parse(text);}catch(e){UI.importMsg='Ese código no es válido. Pega el texto completo que exportaste.';render();return;}
  if(!d||d.app!=='shuoshuokan'||!Array.isArray(d.bank)){UI.importMsg='Ese código no es un respaldo de 說說看.';render();return;}
  const base=new Set(BASE_BANK.map(e=>e.hz));const extra=d.bank.filter(e=>!base.has(e.hz));const have=new Set(fullBank().map(e=>normHz(e.hz)));let n=0;
  extra.forEach(e=>{if(e.hz&&!have.has(normHz(e.hz))){B.added.push({hz:e.hz,py:e.py,es:e.es,cat:e.cat||'Otro',ex:e.ex||'',src:e.src||'tú',status:e.status||'nuevo'});have.add(normHz(e.hz));n++;}});
  d.bank.forEach(e=>{if(base.has(e.hz)&&e.status==='familiar')B.status[e.hz]='familiar';});
  let msg=`Vocabulario: ${n} entradas nuevas unidas; lo que ya tenías no cambió.`;
  if(mode==='all'&&d.prog){P=normProg(d.prog);P.updatedAt=Date.now();msg+=' Progreso restaurado desde el respaldo.';}
  rebuildIndex(fullBank());persist();UI.importMsg=msg;render();}

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.tagName==='SELECT')return;const act=a.dataset.act;
  switch(act){
  case 'nav':stopSpeech();UI.screen=a.dataset.to;if(UI.screen==='home'&&SESSION&&SESSION.done)SESSION=null;UI.bankMsg=null;UI.importMsg=null;UI.confirmReset=false;render();window.scrollTo(0,0);break;
  case 'sel-topic':UI.sel={type:'topic',id:+a.dataset.id};render();break;
  case 'sel-all':UI.sel={type:'all'};render();break;
  case 'sel-struct':UI.sel={type:'struct',id:a.dataset.id};render();break;
  case 'toggle-structs':UI.showStructs=!(UI.showStructs||UI.sel.type==='struct');if(!UI.showStructs&&UI.sel.type==='struct')UI.sel={type:'topic',id:1};render();break;
  case 'mode':P.prefs.mode=a.dataset.id;persist('prog');render();break;
  case 'sit':UI.sit=a.dataset.id;render();break;
  case 'method':P.prefs.method=a.dataset.id;persist('prog');render();break;
  case 'goal':P.prefs.goal=+a.dataset.n;persist('prog');render();break;
  case 'start':case 'new-session':startSession();break;
  case 'resume':UI.screen='play';nextExercise();break;
  case 'practice':UI.sel={type:'struct',id:a.dataset.id};P.prefs.mode='mixed';UI.screen='home';startSession();break;
  case 'play':if(UI.ex)speak(UI.ex.audio||(UI.ex.question&&UI.ex.question.toks)||[]);break;
  case 'reveal':UI.revealed++;render();break;
  case 'hint':UI.hints=Math.min(hintCount(UI.ex),UI.hints+1);render();break;
  case 'opt':if(UI.res)break;UI.pick=+a.dataset.i;render();break;
  case 'tile':{if(UI.res)break;const i=+a.dataset.i;UI.tiles.pool[i].used=true;UI.tiles.sel.push(i);UI.tSel=-1;render();break;}
  case 'btile':{if(UI.res)break;const k=+a.dataset.k;UI.tSel=UI.tSel===k?-1:k;render();break;}
  case 'tmove':{const T=UI.tiles,k=UI.tSel,d=+a.dataset.d,j=k+d;if(k<0||j<0||j>=T.sel.length)break;[T.sel[k],T.sel[j]]=[T.sel[j],T.sel[k]];UI.tSel=j;render();break;}
  case 'tdel':{const T=UI.tiles,k=UI.tSel;if(k<0)break;const pi=T.sel.splice(k,1)[0];T.pool[pi].used=false;UI.tSel=-1;render();break;}
  case 'tclear':UI.tiles.sel.forEach(pi=>UI.tiles.pool[pi].used=false);UI.tiles.sel=[];UI.tSel=-1;render();break;
  case 'check':{const el=document.getElementById('ans');if(el)UI.lastTyped=el.value;check();break;}
  case 'self':selfGrade(a.dataset.ok==='1');break;
  case 'fix-open':UI.fixOpen=true;render();break;
  case 'fix-close':UI.fixOpen=false;render();break;
  case 'fix':fixAction(a.dataset.k);break;
  case 'undo-fix':undoFix(+a.dataset.i);break;
  case 'copy-reports':copy(reportsText());break;
  case 'next':stopSpeech();nextExercise();window.scrollTo(0,0);break;
  case 'repeat':repeatExercise();break;
  case 'end':endSession();window.scrollTo(0,0);break;
  case 'repeat-fails':{const f=SESSION.fails.slice(-10);startSession(true);SESSION.queue=f;nextFromQueue();break;}
  case 'copy-summary':copy(summaryText());break;
  case 'dl-summary':download('shuoshuokan-resumen.txt',summaryText());break;
  case 'add-bulk':{const t=document.getElementById('f-bulk').value;const list=t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [hz,py,es,cat,ex]=l.split(/\s*[|｜]\s*/);return {hz,py,es,cat,ex,raw:l};});addEntries(list);break;}
  case 'export':UI.exportText=exportData();render();break;
  case 'copy-export':copy(UI.exportText,'#exp');break;
  case 'dl-export':download('shuoshuokan-respaldo.json',exportData(),'application/json');break;
  case 'progress-text':copy(progressText());break;
  case 'import':{const t=document.getElementById('imp').value.trim();const f=document.getElementById('impfile');const mode=a.dataset.mode;
    if(f&&f.files&&f.files[0]){f.files[0].text().then(x=>doImport(x,mode));}else if(t)doImport(t,mode);else{UI.importMsg='Pega tu código o elige un archivo.';render();}break;}
  case 'reset':{const c=+a.dataset.c;if(c===1){UI.confirmReset=true;}else if(c===2){const keep=P.prefs;P=defProg();P.prefs=keep;persist('prog');UI.confirmReset=false;flash('Progreso reiniciado.');}else UI.confirmReset=false;render();break;}
  }});
function nextFromQueue(){const q=SESSION.queue;if(q&&q.length){const ex=q.shift();const fresh={...ex,repeated:0};if(fresh.answer.type==='mc')fresh.answer={...fresh.answer,opts:shuffle(fresh.answer.opts)};else fresh.answer={...fresh.answer,pool:shuffle(fresh.answer.pool)};nextExercise(fresh);}else nextExercise();}
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.act==='rate'){P.prefs.rate=+t.value;persist('prog');}
  else if(t.dataset.act==='voice'){P.prefs.voice=t.value;persist('prog');}
  else if(t.dataset.act==='method-change'){P.prefs.method=t.value;persist('prog');const ex=UI.ex;if(!ex||UI.res)return;
    const rebuilt=ex.kind==='vocab'?ex:(BUILDERS[ex.kind](ex.st,{lvl:levelOf(rec(ex.sids[0])),method:t.value,fmt:ex.fmt,sit:ex.sit,Q:ex.Q,p:ex.kind==='subst'||ex.kind==='build'?undefined:undefined})||ex);
    UI.res=null;UI.pick=null;UI.tSel=-1;UI.ex=rebuilt;UI.tiles=rebuilt.answer.type==='free'?{pool:rebuilt.answer.pool.map((x,i)=>({t:x,i,used:false})),sel:[]}:null;render();}
  else if(t.id==='bcat'){UI.bankCat=t.value;render();}else if(t.id==='bst'){UI.bankStatus=t.value;render();}
  else if(t.id==='pytiles'){P.prefs.pyTiles=t.checked;persist('prog');}});
document.addEventListener('input',e=>{if(e.target.id==='bq'){UI.bankQ=e.target.value;clearTimeout(window.__bq);window.__bq=setTimeout(()=>{const pos=e.target.selectionStart;render();const el=document.getElementById('bq');if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(_){}}},250);}});
document.addEventListener('submit',e=>{if(e.target.id==='addone'){e.preventDefault();const g=id=>document.getElementById(id).value;addEntries([{hz:g('f-hz'),py:g('f-py'),es:g('f-es'),cat:g('f-cat'),ex:g('f-ex')}]);}});
document.addEventListener('keydown',e=>{if(UI.screen!=='play'||!UI.ex)return;const tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Enter'&&!e.isComposing){if(tag==='select'||tag==='textarea')return;e.preventDefault();if(UI.res){const nb=document.getElementById('nextbtn');if(nb)nb.click();}else{const el=document.getElementById('ans');if(el)UI.lastTyped=el.value;check();}return;}
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  if(/^[1-4]$/.test(e.key)&&UI.ex.answer.type==='mc'&&!UI.res){const i=+e.key-1;if(i<UI.ex.answer.opts.length){UI.pick=i;render();}}});
