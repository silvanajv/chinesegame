<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>說說看 Mandarín</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Figtree:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500&display=swap">
<style>
/* Layout: a study desk — one centered column; each exercise is a single card with the sentence set large in brush-kai, answers below, feedback slides in under it */
:root{
  --bg:#eef1f5; --card:#ffffff; --ink:#18202c; --muted:#5d6878; --line:#d8dee7; --soft:#f4f6f9;
  --accent:#2a55a3; --accent-ink:#ffffff; --accent-soft:#e3eaf7; --seal:#c23b2d;
  --good:#1d8a57; --good-bg:#e1f3e9; --warn:#a86a10; --warn-bg:#fbefd9; --bad:#c0392b; --bad-bg:#fbe3df;
  --f-zh:"LXGW WenKai TC","Kaiti TC","BiauKai","STKaiti","Noto Serif TC",serif;
  --f-ui:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-py:"Noto Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141b; --card:#181e28; --ink:#e6ebf2; --muted:#98a3b3; --line:#2a3342; --soft:#1f2632;
  --accent:#7ea4ec; --accent-ink:#0d1422; --accent-soft:#22304a; --seal:#ef6a58;
  --good:#4cc78a; --good-bg:#16352a; --warn:#e8b04f; --warn-bg:#3a2c12; --bad:#ff7a69; --bad-bg:#3d1d19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --card:#181e28; --ink:#e6ebf2; --muted:#98a3b3; --line:#2a3342; --soft:#1f2632;
  --accent:#7ea4ec; --accent-ink:#0d1422; --accent-soft:#22304a; --seal:#ef6a58;
  --good:#4cc78a; --good-bg:#16352a; --warn:#e8b04f; --warn-bg:#3a2c12; --bad:#ff7a69; --bad-bg:#3d1d19; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.zh{font-family:var(--f-zh)}
.py{font-family:var(--f-py);color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.85rem}
h1{font-size:1.5rem;margin:0 0 12px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1rem;margin:20px 0 8px;font-weight:700}
.lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
/* header */
.top{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand .seal{width:38px;height:38px;border-radius:8px;background:var(--seal);color:#fff;font-family:var(--f-zh);font-size:1.6rem;display:grid;place-items:center;line-height:1}
.brand b{display:block;font-family:var(--f-zh);font-size:1.25rem;line-height:1}
.brand small{color:var(--muted);font-size:.75rem}
.top nav{display:flex;flex-wrap:wrap;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.top nav button{border:0;background:none;border-radius:9px;padding:6px 12px;font-weight:600;font-size:.9rem}
.top nav button.on{background:var(--accent);color:var(--accent-ink)}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.8rem;flex-wrap:wrap}
.lvl{font-weight:700}
.xpbar{width:70px;height:6px;background:var(--line);border-radius:9px;overflow:hidden}.xpbar i{display:block;height:100%;background:var(--accent)}
.save{padding:2px 8px;border-radius:99px;font-weight:600}
.save.ok{background:var(--good-bg);color:var(--good)}.save.warn{background:var(--warn-bg);color:var(--warn)}.save.bad{background:var(--bad-bg);color:var(--bad)}.save.wait{background:var(--soft);color:var(--muted)}
@media (max-width:560px){.me{margin-left:0;width:100%}}
/* controls */
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 18px;font-weight:700}
.primary.big{padding:15px;font-size:1.1rem;width:100%}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:600}
.ghost:disabled,.primary:disabled{opacity:.45;cursor:default}
.sm{padding:5px 10px;font-size:.85rem;border-radius:9px}
.danger{background:var(--bad);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:700}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:600}
.chip b{color:var(--muted);margin-right:2px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.chip.on b{color:inherit;opacity:.8}
.chip.sm{padding:4px 12px}
.sits{align-items:center;margin-top:10px}
.structs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:10px}
.srow{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.srow.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.srow .zh{font-size:1.1rem}.srow .pat{font-size:.78rem;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:560px){.modes{grid-template-columns:1fr 1fr}}
.mode,.seg4 button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mode small,.seg4 small{color:var(--muted);font-size:.78rem}
.mode.on,.seg4 button.on{border-color:var(--accent);background:var(--accent-soft)}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.seg4{grid-template-columns:1fr 1fr}}
.home section{display:flex;flex-direction:column}
.resume{background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.note{color:var(--muted);font-size:.85rem}
.pill{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);letter-spacing:.02em}
.pill.l1{background:var(--warn-bg);color:var(--warn)}.pill.l2{background:var(--accent-soft);color:var(--accent)}.pill.l3{background:var(--good-bg);color:var(--good)}.pill.new{background:var(--warn-bg);color:var(--warn)}
/* play */
.ptop{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.cnt,.xp{font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.ex{display:flex;flex-direction:column;gap:14px}
.exhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.kind{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--seal)}
.stchip{font-family:var(--f-zh);font-size:1rem;display:flex;gap:6px;align-items:center}
.instr{margin:0;font-size:1.05rem}
.audio{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:10px 12px}
.audio .play{background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:10px 18px;font-weight:700}
.audio label{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.audio select,.msel select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 6px;max-width:220px}
.warn{color:var(--warn);font-size:.85rem;margin:0}
.reveal{min-height:1em}
.zh.big,.big .zh{font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.25}
.big1{font-size:4rem;line-height:1.1}
.qtext,.basesent{display:flex;flex-direction:column;gap:2px}
.cue{font-size:1.15rem;font-weight:600;background:var(--soft);border-radius:12px;padding:10px 14px}
.pattern{font-family:var(--f-zh);font-size:1.1rem;color:var(--accent);border:1px dashed var(--accent);border-radius:10px;padding:6px 12px;align-self:flex-start}
.changes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.scr{display:flex;flex-wrap:wrap;gap:8px}.scr span{font-size:1.4rem;background:var(--soft);border-radius:8px;padding:2px 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.es,.opts.desc{grid-template-columns:1fr}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{position:relative;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 12px 12px 38px;min-height:56px}
.opt .zh{font-size:1.45rem}
.opt .k{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:.75rem;color:var(--muted);font-family:var(--f-py)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.build{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.built{flex:1;min-width:180px;min-height:58px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ph{color:var(--muted);font-size:.9rem;padding:0 6px}
.tile{background:var(--card);border:1px solid var(--line);border-bottom-width:3px;border-radius:10px;padding:4px 12px;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:44px}
.tile .zh{font-size:1.5rem}.tile small{font-family:var(--f-py);font-size:.7rem;color:var(--muted)}
.tile.focus{border-color:var(--accent);background:var(--accent-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tctl{display:flex;gap:6px;flex-wrap:wrap}
.ans{flex:1;min-width:200px;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--card);font-size:1.1rem}
.ans.zh{font-size:1.4rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.msel{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center;margin-right:auto}
.hints{margin:0;padding:10px 10px 10px 30px;background:var(--warn-bg);border-radius:12px;display:flex;flex-direction:column;gap:4px}
.hints li{font-size:.95rem}
.fb{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.fb.ok{background:var(--good-bg);border-color:transparent}.fb.partial,.fb.review{background:var(--warn-bg);border-color:transparent}.fb.bad{background:var(--bad-bg);border-color:transparent}
.verdict{font-weight:800;font-size:1.1rem}
.fb.ok .verdict{color:var(--good)}.fb.partial .verdict,.fb.review .verdict{color:var(--warn)}.fb.bad .verdict{color:var(--bad)}
.gain{font-size:.8rem;font-weight:700;color:var(--muted);margin-left:6px}
.ach-new{font-weight:700}
.sent{background:var(--card);border-radius:10px;padding:8px 12px}
.sent .zh.big{font-size:1.5rem}.sent .es{font-size:.95rem}
.yours .zh{font-size:1.3rem}
.tags{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--card);margin-right:4px}
.t-gram{color:var(--bad)}.t-vocab{color:var(--accent)}.t-char{color:var(--seal)}.t-py{color:var(--warn)}.t-nat{color:var(--warn)}.t-comp{color:var(--muted)}.t-info{color:var(--muted)}
.more{font-size:.95rem}.more .zh{font-size:1.2rem}
.vocabfb{display:flex;flex-direction:column;gap:4px}
/* summary/bank/progress */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kpis div{background:var(--soft);border-radius:12px;padding:12px}.kpis b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums}.kpis span{font-size:.78rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:560px){.two{grid-template-columns:1fr}}
.two ul,.summary ul{margin:0;padding-left:20px}
.focus{background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin:0}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.zh.big{font-size:1.5rem}
.tbl tr.hl td{background:var(--warn-bg)}
.addf{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.addf input,.addf select,textarea,.filters input,.filters select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--card);min-width:0;width:100%}
@media (max-width:560px){.addf{grid-template-columns:1fr}}
details{margin-top:12px}summary{cursor:pointer;font-weight:600}
textarea{display:block;margin:8px 0;font-family:var(--f-py)}
.confirm{margin-top:12px;background:var(--good-bg);border-radius:12px;padding:10px 14px;line-height:1.6}
.bhead{display:flex;flex-direction:column;gap:8px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:8px}@media (max-width:560px){.filters{grid-template-columns:1fr}}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{border:1px dashed var(--line);border-radius:12px;padding:10px;opacity:.55;display:flex;flex-direction:column}
.ach.on{opacity:1;border-style:solid;border-color:var(--good);background:var(--good-bg)}.ach small{color:var(--muted);font-size:.78rem}
.chk{display:flex;gap:8px;align-items:center}
.fixp{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--card);border-radius:12px;padding:12px}.fixp small{margin:-2px 0 6px}.fixp textarea{width:100%}
.flash{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-weight:600;z-index:20;max-width:90vw}
/* home */
.home2{gap:22px;padding-bottom:20px}
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-block:8px 4px}
.hello{font-size:2.6rem;line-height:1;color:var(--seal)}
.hero h1{font-size:1.7rem;margin:4px 0 0}
.hero p{margin:0}
.streak{font-weight:700;font-size:.9rem;background:var(--warn-bg);color:var(--warn);padding:3px 10px;border-radius:99px}
.hero .primary.big{margin-top:10px}
.progress{display:flex;flex-direction:column;gap:8px}
.lvlrow{display:flex;justify-content:space-between;align-items:baseline}.lvlrow b{font-size:1.5rem}.lvlrow span{color:var(--muted);font-variant-numeric:tabular-nums}
.progress .bar{height:10px;flex:none}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;border-top:1px solid var(--line);padding-top:12px}
.minis b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}.minis b small{font-size:.8rem;color:var(--muted);font-weight:600}.minis span{font-size:.75rem;color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.acts{grid-template-columns:1fr}}
.act{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.act:hover{border-color:var(--accent)}
.actg{flex:none;width:56px;height:56px;display:grid;place-items:center;font-size:2rem;border:1.5px solid var(--accent);border-radius:10px;color:var(--accent);background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.actt{display:flex;flex-direction:column;gap:1px;min-width:0}.actt b{font-size:1.05rem}.actt small{color:var(--muted);font-size:.85rem}.actt em{font-style:normal;font-size:.75rem;color:var(--accent);font-weight:600;margin-top:3px}
.cont{display:flex;flex-direction:column;gap:12px}
.controw{display:flex;gap:16px;align-items:center}
.glyphbox{flex:none;width:84px;height:84px;display:grid;place-items:center;font-size:3.4rem;border:2px solid var(--accent);border-radius:12px;background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.contt{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;align-items:flex-start}.contt b{font-size:1.1rem}
.due{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;font-weight:600}
.back{align-self:flex-start;text-decoration:none}
.ptitle{margin:4px 0 0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:130px;align-items:end;margin-bottom:6px}
.wcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.wcol i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px}
.wcol small{color:var(--muted);font-size:.75rem}.wval{font-size:.75rem;font-variant-numeric:tabular-nums;color:var(--muted)}
/* practice list, cta, cards */
.tlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.trow{display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px}
.trow:last-child{border-bottom:0}.trow:hover{background:var(--soft)}
.trow.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.tnum{flex:none;width:26px;height:26px;border-radius:99px;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.trow.on .tnum{background:var(--accent);color:var(--accent-ink)}
.ttxt{display:flex;flex-direction:column;min-width:0}.ttxt small{color:var(--muted);font-size:.8rem;font-family:var(--f-zh)}
.cta{display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:center}.cta p{margin:0;font-weight:600}
.top{justify-content:flex-end;padding-block:10px 0}
.cardfull{display:flex;gap:16px;align-items:flex-start;background:var(--card);border-radius:12px;padding:12px}
.cardfull .contt{gap:4px}.cardfull .lbl{margin-right:4px}
.why{margin:0;font-weight:600}
.bigplay{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:14px 22px;font-weight:700;font-size:1.05rem}
.pyopt{font-family:var(--f-py);font-size:1.4rem}
.opts.comp .zh,.opts.word .zh{font-size:1.6rem}
.es2{display:block;font-size:.85em;color:var(--muted);font-weight:400;margin-top:2px}
.addf select{min-width:0}
/* bottom nav */
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;

def({id:'hen',name:'很 + adjetivo',topic:3,pattern:'Sujeto + 很 + adjetivo',
 expl:'Con adjetivos no se usa 是: 我很忙, 天氣很冷. Al negar, 不 sustituye a 很.',
 h2:'Con adjetivos no hay 是. Negativo: 不 + adjetivo (sin 很). Pregunta: adjetivo + 嗎.',
 cando:'Decir cómo estás y qué tiempo hace',
 slots:{subj:[...PERS,'天氣'],a:ADJ},sub:{subj:'sujeto',a:'adjetivo'},forms:{neg:1,ma:1,anb:1,plural:1},
 valid:p=>(p.subj==='天氣')===(p.a.k==='w'),
 yes:p=>['很',p.a.hz],no:p=>['不',p.a.hz],
 render(p){const W=p.subj==='天氣',q=!!p.q,a=p.a;
  const es=W?weatherEs(a,p.neg,q):(a.hz==='好'&&p.q==='ma'?fin('cómo '+CONJ.estar[pp(p.subj)]+(pre(p.subj)?' '+pre(p.subj):''),1):esC({subj:p.subj,v:'estar',rest:a.es,neg:p.neg,q}));
  if(p.q==='ma')return {toks:[p.subj,a.hz,'嗎','？'],es};
  if(p.q==='anb')return {toks:[p.subj,a.hz,'不',a.hz,'？'],es};
  if(p.neg)return {toks:[p.subj,'不',a.hz,'。'],alts:[[p.subj,'不','太',a.hz,'。']],es};
  return {toks:[p.subj,'很',a.hz,'。'],es};}});

const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};

const Q_SUBJ=['你','你','你','你','您','你們','他','她'];

function start(l){
  const cards=l.build();cards.forEach(c=>{c.streak=0;c.done=false;c.seen=false;});
  G={l,cards,keys:new Set(cards.map(c=>c.key)),T:SP().start-(l.exam?500:0),pyOnly:!!l.exam&&save.examMode!=='meaning',phase:l.learn?'learn':'speed',
     queue:l.learn?cards.slice():shuffle(cards),learnI:0,mastered:0,first:0,miss:{},t0:performance.now(),lock:true};
  if(l.learn)shell();else{G.phase='speed';shell();}
  setTimeout(next,250);
}
function shell(){
  const sp=G.phase==='speed';
  app.innerHTML=`<div class="screen play">
    <div class="hud"><button class="back" id="bk" aria-label="Salir">✕</button><button class="back" id="pz" aria-label="Pausa">❚❚</button><span class="ln">${G.l.name}</span>
      <span class="phase">${sp?'Ronda rápida':'Aprender'}</span><span class="stat" id="st"></span></div>
    <div class="prog"><i id="pg"></i></div>

    <div class="timer" id="tm" ${sp?'':'hidden'}><i id="tb"></i></div>
    <div class="opts" id="op"></div>
    <button class="primary" id="cont" hidden data-enter>Siguiente →</button>
    <div class="pausep" id="pp" hidden><div class="label">En pausa</div><p>Toma tus notas con calma. El reloj está detenido.</p><div id="peek"></div>
      <div class="row"><button class="secondary" id="pk">Ver respuesta</button><button class="primary" id="rs" data-enter>Continuar</button></div></div></div>`;
  $('bk').onclick=home;$('pz').onclick=()=>G&&(G.paused?resume():pause());$('rs').onclick=resume;$('pk').onclick=peek;$('cont').onclick=()=>{if(G&&G.waiting){G.waiting=false;next();}};
  hud();
}
function hud(){
  if(!G)return;const n=G.cards.length;
  if(G.phase==='learn'){$('st').innerHTML=`<b>${Math.min(G.learnI,n)}</b>/${n}`;$('pg').style.width=(G.learnI/n*100)+'%';}
  else{$('st').innerHTML=`<b>${G.mastered}</b>/${n} · <b>${(G.T/1000).toFixed(1)}</b> s`;$('pg').style.width=(G.mastered/n*100)+'%';}
}
function pause(){
  if(!G||G.paused)return;G.paused=true;
  if(G.phase==='speed'&&!G.lock){G.pausedRem=G.deadline-performance.now();stopTimer();}
  G.contWas=!$('cont').hidden;
  $('op').hidden=true;$('tm').hidden=true;$('cont').hidden=true;
  $('peek').innerHTML='';$('pk').hidden=G.lock;$('pp').hidden=false;$('pz').textContent='▶';
}
function peek(){
  const c=G&&G.card;if(!c||G.lock)return;G.peeked=true;$('pk').hidden=true;
  const main=c.kind==='id'?`<span class="han">${c.q}</span> lleva <span class="han">${c.top}</span> · ${c.sub}`:`<span class="han">${c.q}</span> <span class="py">${c.top}</span> · ${c.sub}`;
  $('peek').innerHTML=`<div class="reveal"><div class="main">${main}</div>${hints(c).map(h=>`<div class="h">${h}</div>`).join('')}<div class="h">Esta tarjeta volverá más adelante, sin contar como error.</div></div>`;
}
function resume(){
  if(!G||!G.paused)return;G.paused=false;
  $('pp').hidden=true;$('op').hidden=false;$('tm').hidden=G.phase!=='speed';$('cont').hidden=!G.contWas;$('pz').textContent='❚❚';
  if(G.peeked&&!G.lock){G.peeked=false;G.lock=true;G.pausedRem=null;G.queue.splice(Math.min(G.queue.length,3),0,G.card);next();return;}
  if(G.pendingNext){G.pendingNext=false;next();return;}
  if(G.phase==='speed'&&!G.lock&&G.pausedRem!=null){G.deadline=performance.now()+G.pausedRem;G.pausedRem=null;tick();}
}
function next(){
  if(!G)return;
  if(G.paused){G.pendingNext=true;return;}
  if(!G.queue.length){
    if(G.phase==='learn')return interstitial();
    return finish();
  }
  const c=G.card=G.queue.shift();
  const canRev=G.phase==='speed'&&(c.kind==='char'||c.kind==='word');
  G.rev=canRev&&!G.pyOnly&&Math.random()<(G.l.exam?.3:.35);
  G.opts=makeOpts(c,G.rev);
  const stg=$('stg');stg.className='stage';
  const prompt=G.rev?(c.kind==='word'?'¿Cuál es la palabra?':'¿Cuál es el carácter?'):
    c.kind==='rad'?'¿Qué significa este radical?':c.kind==='id'?'¿Qué radical lleva?':c.kind==='word'?'¿Qué palabra es?':'¿Qué carácter es?';
  const chars=[...c.q];
  stg.innerHTML=`<div class="prompt">${prompt}</div>`+(G.rev
    ?`<div class="revq"><div class="bigpy">${c.top}</div><div class="revsub">${c.sub}</div></div>`
    :`<div class="cells${chars.length>1?' two':''}">${chars.map(ch=>`<div class="cell"><span class="glyph">${ch}</span></div>`).join('')}</div>`)
    +`<div class="toast" id="to"></div>`;
  $('op').innerHTML=G.opts.map((o,i)=>{
    const top=G.rev?`<span class="top hanopt solo">${o.q}</span>`
      :c.kind==='id'?`<span class="top hanopt">${o.top}</span><span class="sub">${o.sub}</span>`
      :G.pyOnly?`<span class="top pyonly">${o.top}</span>`
      :`<span class="top">${o.top}</span><span class="sub">${o.sub}</span>`;
    return `<button class="opt" data-i="${i}"><span class="k">${i+1}</span>${top}</button>`;}).join('');
  SR.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  $('cont').hidden=true;G.waiting=false;G.lock=false;
  hud();
  if(G.phase==='speed'){
    G.dur=G.T+(c.kind==='word'?400:0)+(c.kind==='id'?500:0)+(G.rev?300:0);
    G.deadline=performance.now()+G.dur;tick();
  }
}
function makeOpts(c,rev){
  let cands;
  if(c.kind==='rad')cands=RAD.map(([g,p,m])=>({key:'rad:'+g,q:g,top:p,sub:m}));
  else if(c.kind==='id')cands=Object.entries(RADOPTS).map(([t,s])=>({key:'r:'+t,q:t,top:t,sub:s}));
  else if(c.kind==='word')cands=WORDS.map(w=>wordCard(w[0]));
  else cands=ALL.map(x=>charCard(x[0]));
  const conf=c.kind==='char'?confOf(c.q):new Set();const pp=plain(c.top);
  const scored=[];
  for(const o of cands){
    if(c.kind==='id'?o.top===c.top:o.q===c.q)continue;
    if(!rev&&o.sub===c.sub)continue;
    if(G.pyOnly&&o.top===c.top)continue;
    let s=Math.random()*1.2;
    if(G.keys.has(o.key))s+=1;
    if(c.kind==='char'){if(conf.has(o.q))s+=rev?3:1.2;if(plain(o.top)===pp)s+=rev?1:3;}
    if(c.kind==='word'&&[...o.q].some(ch=>c.q.includes(ch)))s+=2.5;
    if(c.kind==='id'&&(c.top==='日'&&o.top==='目'||c.top==='目'&&o.top==='日'))s+=3;
    scored.push([s,o]);
  }
  scored.sort((a,b)=>b[0]-a[0]);
  const ex=G.pyOnly;const kf=o=>rev?o.q:ex?o.top:o.sub;
  const picks=[];const seen=new Set([kf(c)]);
  for(const [,o] of scored){const k=kf(o);if(seen.has(k))continue;seen.add(k);picks.push(o);if(picks.length===3)break;}
  return shuffle([{...c,ok:true},...picks]);
}
let raf=0;
function tick(){
  if(!G||G.lock||G.paused||G.phase!=='speed')return;
  const rem=G.deadline-performance.now();const f=Math.max(0,rem/G.dur);
  const tb=$('tb');if(tb)tb.style.transform=`scaleX(${f})`;
  const tm=$('tm');if(tm)tm.classList.toggle('low',f<.35);
  if(rem<=0)return answer(null);
  raf=requestAnimationFrame(tick);
}
function stopTimer(){cancelAnimationFrame(raf);}
function hints(c){
  const h=[];
  if(c.kind==='char'){
    const ct=compText(c.q);if(ct)h.push('Componentes: '+ct.replace(/(\S)/,'<span class="han">$1</span>'));
    else for(const r in IDS)if(IDS[r].includes(c.q))h.push(`Radical <span class="han">${r}</span> · ${RADOPTS[r]}`);
    const ws=WORDS.filter(w=>w[0].includes(c.q)).slice(0,2).map(w=>`<span class="han">${w[0]}</span> ${w[1]} · ${w[2]}`);
    if(ws.length)h.push('En: '+ws.join(' / '));
    const cf=[...confOf(c.q)].filter(x=>A[x]).slice(0,3);
    if(cf.length)h.push('No confundir con: '+cf.map(x=>`<span class="han">${x}</span> ${A[x].p}`).join(', '));
  }else if(c.kind==='word'){
    h.push([...c.q].map(ch=>A[ch]?`<span class="han">${ch}</span> ${A[ch].m}`:ch).join(' + '));
  }else if(c.kind==='id'){
    if(A[c.q])h.push(`<span class="han">${c.q}</span> ${A[c.q].p} · ${A[c.q].m}`);
  }
  return h;
}
function recordMiss(c){G.miss[c.key]=G.miss[c.key]||{c,n:0};G.miss[c.key].n++;}
function answer(i){
  if(!G||G.lock||G.paused)return;G.lock=true;stopTimer();
  const c=G.card;const btns=SR.querySelectorAll('.opt');btns.forEach(b=>b.disabled=true);
  const ri=G.opts.findIndex(o=>o.ok);const ok=i===ri;const stg=$('stg');
  if(i!=null&&!ok)btns[i].classList.add('wrong');btns[ri].classList.add('right');
  stg.classList.add(ok?'ok':'no');

  if(G.phase==='learn'){
    G.learnI++;
    if(ok)c.streak=1;else{c.streak=0;recordMiss(c);}
    stg.classList.add('revealed');
    const main=c.kind==='id'
      ?`<span class="han">${c.q}</span> lleva <span class="han">${c.top}</span> · ${c.sub}`
      :`<span class="han">${c.q}</span> <span class="py">${c.top}</span> · ${c.sub}`;
    const rv=document.createElement('div');rv.className='reveal';
    rv.innerHTML=`<div class="main">${main}</div>${hints(c).map(h=>`<div class="h">${h}</div>`).join('')}`;
    stg.insertBefore(rv,$('to'));if(c.kind==='char'||c.kind==='word')speak([c.q]);
    $('cont').hidden=false;G.waiting=true;hud();
    return;
  }

  // speed phase
  const firstTime=!c.seen;c.seen=true;
  if(ok){
    if(firstTime)G.first++;
    c.streak++;G.T=Math.max(SP().min,G.T-150);
    if(c.streak>=G.l.need){c.done=true;G.mastered++;}
    else G.queue.splice(Math.min(G.queue.length,5+(Math.random()*4|0)),0,c);
    hud();setTimeout(next,240);
  }else{
    c.streak=0;recordMiss(c);G.T=Math.min(SP().max,G.T+SP().pen);
    G.queue.splice(Math.min(G.queue.length,3),0,c);
    const to=$('to');
    const ans=c.kind==='id'?`<span class="han">${c.top}</span> ${c.sub}`:`<span class="han">${c.q}</span> ${c.top} · ${c.sub}`;
    to.innerHTML=(i==null?'⏱ ':'')+ans;to.className='toast on';
    hud();setTimeout(next,1300);
  }
}
function interstitial(){
  stopTimer();G.lock=true;
  const n=G.cards.length;const got=G.cards.filter(c=>c.streak>0).length;
  app.innerHTML=`<div class="screen inter">
    <div class="big">快</div><h2>Ahora, la ronda rápida</h2>

}
function finish(){
  stopTimer();
  const l=G.l;const n=G.cards.length;const time=performance.now()-G.t0;
  const acc=Math.round(G.first/n*100);
  const misses=Object.values(G.miss).sort((a,b)=>b.n-a.n);

  for(const c of G.cards){if(c.kind!=='char'&&c.kind!=='word')continue;const m=G.miss[c.key];
    if(m)save.weak[c.key]=(save.weak[c.key]||0)+m.n;else delete save.weak[c.key];}
  if(!l.custom){
    const i=l.idx;const prev=save.best[i];
    save.best[i]={time:prev?Math.min(prev.time,time):time,acc:prev?Math.max(prev.acc,acc):acc};
    if(i<EXAM&&save.unlocked<i+1)save.unlocked=i+1;
  }
  for(const c of G.cards){if(c.kind!=='char'&&c.kind!=='word')continue;srsUpdate(c.q,G.miss[c.key]?0:1,0);}
  if(typeof studied==='function')studied(Math.min(time,30*60000));
  persistS();
  window.TELE&&TELE.sprintEnd({leccion:l.name,segundos:Math.round(time/1000),precisionPrimera:acc,fallados:misses.length,tarjetas:n,velocidad:save.speed,modoExamen:l.exam?save.examMode:''});
  const nextL=!l.custom&&l.idx<EXAM?LESSONS[l.idx+1]:null;
  const missCards=misses.map(m=>m.c);
  app.innerHTML=`<div class="screen results">
    <h2><span class="han">完成</span>${l.name}</h2>
    <div class="kpis"><div class="kpi"><b>${fmt(time)}</b><span>tiempo</span></div><div class="kpi"><b>${acc}%</b><span>a la primera (ronda rápida)</span></div><div class="kpi"><b>${(G.T/1000).toFixed(1)} s</b><span>velocidad final</span></div></div>
    ${misses.length?`<div class="group"><h3 class="label" style="margin:0 0 8px">Para repasar</h3><div class="chips">${misses.map(m=>chip(m.c.q,m.c.kind==='id'?m.c.top+' '+m.c.sub:m.c.top,(m.c.kind==='id'?'radical':m.c.sub)+' · ×'+m.n)).join('')}</div></div>`
      :`<div class="note">Sin errores en toda la lección.</div>`}
    <div class="row">
      ${misses.length?`<button class="secondary" id="pm">Practicar estos ${misses.length}</button>`:`<button class="secondary" id="again">Repetir</button>`}
      ${nextL?`<button class="primary" id="nx" data-enter>Siguiente: ${nextL.name}</button>`:`<button class="primary" id="hm2" data-enter>Volver a lecciones</button>`}
    </div>
    <button class="linkbtn" id="hm" style="align-self:flex-start">Volver a lecciones</button>
  </div>`;
  G=null;
  if($('pm'))$('pm').onclick=()=>preview(customLesson('Repaso: '+l.name,missCards));
  if($('again'))$('again').onclick=()=>start(l);
  if($('nx'))$('nx').onclick=()=>preview(nextL);
  if($('hm2'))$('hm2').onclick=home;
  $('hm').onclick=home;
}

function nextExercise(force){const SS=SESSION;let ex=force||null;const method=P.prefs.method;

    if(due>=0){const r=SS.retry.splice(due,1)[0];const st=S[r.sid];const ks=(SS.mode==='mixed'?KINDS:[SS.mode]).filter(k=>supports(st,k));const k=ks.find(x=>x!==r.kind)||ks[0];

function commit(score,self){const ex=UI.ex,SS=SESSION,method=P.prefs.method,hints=UI.hints;const free=ex.answer.type==='free';

const ZY_YW={yi:'i',ya:'ia',ye:'ie',yao:'iao',you:'iu',yan:'ian',yin:'in',yang:'iang',ying:'ing',yong:'iong',wu:'u',wa:'ua',wo:'uo',wai:'uai',wei:'ui',wan:'uan',wen:'un',wang:'uang',weng:'ong',yu:'v',yue:'ve',yuan:'van',yun:'vn'};
function zhuyin(py){if(!py||/\s/.test(py.trim()))return '';const tone=(toneSeq(py)[0])||0;
  let s=py.normalize('NFD').replace(/ü/gi,'v').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/ü/g,'v');
  let ini='',fin=s;if(ZY_YW[s])fin=ZY_YW[s];else{for(const k of ['zh','ch','sh',...Object.keys(ZY_I)])if(s.startsWith(k)){ini=k;fin=s.slice(k.length);break;}}
  if(['j','q','x'].includes(ini)&&fin.startsWith('u'))fin='v'+fin.slice(1);
  let body;if(fin==='i'&&['zh','ch','sh','r','z','c','s'].includes(ini))body=ZY_I[ini];else{if(fin&&!ZY_F[fin])return '';body=(ZY_I[ini]||'')+(ZY_F[fin]||'');}
  return tone?body+['','','ˊ','ˇ','ˋ'][tone]:'˙'+body;}

const TONE_EN=['neutral','1 (high and flat)','2 (rising)','3 (dipping)','4 (falling)'];
function vocabWhy(ex,v){if(v==='ok'||ex.answer.type!=='mc')return '';const o=ex.answer.opts[UI.pick];if(!o)return '';const c=ex.card;const f=ex.fmt;let m='',en='';const sx=s=>s.replace(/\(suena /g,'(sounds like ');
  if(f==='char2py'){const t=o.tone!=null?o.tone:(toneSeq(o.py)[0]||0);m=`Elegiste ${o.py}, tono ${TONE_NAME[t]}. Se pronuncia ${c.py}, tono ${TONE_NAME[ex.tone]}.`;en=`You chose ${o.py}, tone ${TONE_EN[t]}. It is pronounced ${c.py}, tone ${TONE_EN[ex.tone]}.`;}
  else if(f==='component'){m=`${o.g} (${o.m}) no forma parte de ${c.hz}. ${c.hz} = ${compText(c.hz)}: ${semOf(c.hz).g} (${semOf(c.hz).m}) apunta al significado «${c.es}».`;en=`${o.g} (${o.m}) is not part of ${c.hz}. ${c.hz} = ${sx(compText(c.hz))}: ${semOf(c.hz).g} (${semOf(c.hz).m}) points to the meaning «${c.es}».`;}
  else if(o.card){const x=o.card;m=`Elegiste ${x.hz} (${x.py}): «${x.es}».`;en=`You chose ${x.hz} (${x.py}): «${x.es}».`;
    if(x.pys.some(p=>c.pys.some(q=>compactPy(p)===compactPy(q)))){m+=` Suena parecido a ${c.hz} (${c.py}); distínguelos por ${compText(c.hz)?'sus componentes: '+compText(c.hz):'su forma'}.`;en+=` It sounds like ${c.hz} (${c.py}); tell them apart by ${compText(c.hz)?'their components: '+sx(compText(c.hz)):'their shape'}.`;}
    else{const a=semOf(c.hz),b=semOf(x.hz);if(a&&b&&a.g===b.g){m+=` Los dos llevan ${a.g} (${a.m}); cambia la otra parte.`;en+=` Both have ${a.g} (${a.m}); the other part is different.`;}else if(a){m+=` Pista: ${c.hz} lleva ${a.g} (${a.m}).`;en+=` Tip: ${c.hz} has ${a.g} (${a.m}).`;}}}
  if(!m)return '';const L=(P.prefs.lang||'en');return `<p class="why" data-noi18n>${esc(L==='es'?m:en||m)}${L==='both'&&en?`<span class="es2">${esc(m)}</span>`:''}</p>`;}
function answerOf(ex){const o=ex.answer.opts.find(x=>x.ok);if(ex.answer.kind==='word'&&ex.template)return {toks:[...ex.template.before,...o.toks,...ex.template.after],es:ex.cue||(ex.review.a&&ex.review.a.es)};if(ex.answer.kind==='word')return {toks:o.toks,es:o.es};return o.toks?{toks:o.toks,es:o.es}:ex.review.a;}
function withEs(toks,ex){const A=ex.answer.A;const h=normHz(tj(toks));const it=A.list.find(a=>variants(a,a.sa).some(t=>normHz(tj(t))===h));return {toks,es:it?it.es:''};}

   <div><h2>Ya puedes hacer sola</h2>${can.length?`<ul>${can.map(id=>`<li>${esc(S[id].cando)} <span class="zh muted">${esc(S[id].name)}</span></li>`).join('')}</ul>`:'<p class="muted">Todavía ninguna estructura en nivel Desarrollando. Llegan con aciertos sin pistas.</p>'}</div>

function suggestFocus(SS,rows,mist){const parts=[];const worst=rows.slice().sort((a,b)=>a.a-b.a)[0];
  if(worst&&worst.a<80)parts.push('Practica «'+S[worst.id].name+'» en modo '+(worst.l1<1?'Construir':'Transformar')+'.');
  const tc={};mist.forEach(m=>tc[m.t]=(tc[m.t]||0)+m.n);const top=Object.entries(tc).sort((a,b)=>b[1]-a[1])[0];
  if(top)parts.push({gram:'Fíjate en el orden y en las partículas (不/沒, 嗎, 也).',vocab:'Repasa el vocabulario de tu banco antes de empezar.',char:'Repasa los caracteres parecidos (他/她, 臺/台).',py:'Practica los tonos escribiendo pinyin con números.',nat:'Repasa las formas naturales: 你忙嗎, 太熱了.',comp:'Haz una sesión de Escuchar a velocidad 0.75×.'}[top[0]]||'');
  const acc=SS.sum/SS.n;const mi=METHODS.findIndex(m=>m.id===SS.method);
  if(acc>=0.85&&mi<3)parts.push('Vas bien con «'+METHODS[mi].name+'». Si te sientes cómoda, prueba «'+METHODS[mi+1].name+'».');
  if(!parts.length)parts.push('Prueba Práctica mixta con todos los temas para reciclar lo aprendido.');return parts.join(' ');}

  L.push('說說看 — resumen de sesión ('+new Date(SS.start).toLocaleDateString('es-MX')+')');L.push('Ejercicios: '+SS.n+' · Precisión: '+acc+'% · XP: +'+SS.xp);

  const mist=Object.values(SS.mistakes).sort((a,b)=>b.n-a.n);if(mist.length)L.push('Errores: '+mist.slice(0,5).map(m=>TAGNAME[m.t]+': '+m.m+' ×'+m.n).join(' | '));

function progressText(){const L=['說說看 — progreso','Nivel '+levelNum(P.xp)+' · '+P.xp+' XP · '+P.cnt.sessions+' sesiones',''];
  STRUCT_ORDER.forEach(id=>{const r=rec(id);const a=accOf(r);L.push(S[id].name+': '+LEVELS[levelOf(r)]+(r.a?' · '+r.a+' intentos · '+Math.round((a||0)*100)+'% reciente':''));});

const HAN=/^[㐀-鿿豈-﫿]+$/;
function matchCat(c){if(!c)return 'Otro';const t=toneless(c).trim();const f=CATS.find(x=>toneless(x)===t)||CATS.find(x=>toneless(x).startsWith(t.slice(0,5)));if(/objeto/.test(t))return 'Sustantivo (objeto)';return f||'Otro';}
function addEntries(list,topic){const key=e=>normHz(e.hz)+'|'+e.es.trim().toLowerCase();const have=new Set(fullBank().map(key));const added=[],dup=[],bad=[];
  if(!topic){UI.bankMsg='<b>Elige un tema</b> antes de añadir, para saber a qué parte del curso pertenece cada palabra.';render();return;}
  list.forEach(x=>{const hz=toTrad((x.hz||'').trim()).s;const py=(x.py||'').trim(),es=(x.es||'').trim();
    if(!hz||!HAN.test(hz)||!py||!es){bad.push(x.raw||hz||'(vacía)');return;}
    if(have.has(key({hz,es}))){dup.push(hz+' «'+es+'»');return;}
    const e={hz,py,es,cat:matchCat(x.cat),ex:(x.ex||'').trim(),topic,src:'tú',status:'nuevo',added:today()};B.added.push(e);have.add(key(e));added.push(e);});
  UI.lastTopic=topic;
  if(added.length){window.TELE&&TELE.wordsAdded(added);P.cnt.added+=added.length;rebuildIndex(fullBank());if(SESSION)SESSION.added.push(...added.map(e=>e.hz));persist();}
  UI.lastAdded=added.map(entryId);
  UI.bankMsg=(added.length?`<b>Añadidas a «${esc(topic)}» (${added.length}):</b> ${added.map(e=>`<span class="zh">${esc(e.hz)}</span> ${esc(e.py)} · ${esc(e.es)}`).join(' — ')}`:'<b>No se añadió nada.</b>')+
   (dup.length?`<br>Ya estaban en tu banco y no se modificaron: <span class="zh">${dup.map(esc).join('、')}</span>`:'')+(bad.length?`<br>Faltan datos (字, pinyin y significado son obligatorios): ${bad.map(esc).join(' · ')}`:'')+(added.length?'<br>Están resaltadas en la tabla de abajo.':'');
  if(added.length){UI.bankQ='';UI.bankCat='';UI.bankStatus='';UI.bankTopic='';}render();}
function exportData(){return JSON.stringify({app:'shuoshuokan',v:1,at:new Date().toISOString(),bank:fullBank().map(e=>({hz:e.hz,py:e.py,es:e.es,cat:e.cat,ex:e.ex||'',topic:e.topic||'',status:e.status,src:e.src})),removed:B.removed,prog:P});}
async function download(name,text,mime){try{const d=window.claude&&await window.claude.use('downloads');if(!d){const u=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);flash('Archivo descargado.');return true;}await d.save({filename:name,data:new Blob([text],{type:mime||'text/plain'})});flash('Archivo listo.');return true;}catch(e){flash(e&&e.code==='declined'?'Descarga cancelada.':'No se pudo descargar. Usa “Copiar”.');return false;}}
async function copy(text,sel){try{await navigator.clipboard.writeText(text);flash('Copiado.');}catch(e){const el=sel&&document.querySelector(sel);if(el){el.focus();el.select();flash('Selecciona y copia con Ctrl/Cmd + C.');}else flash('No se pudo copiar.');}}
function doImport(text,mode){let d;try{d=JSON.parse(text);}catch(e){UI.importMsg='Ese código no es válido. Pega el texto completo que exportaste.';render();return;}
  if(!d||d.app!=='shuoshuokan'||!Array.isArray(d.bank)){UI.importMsg='Ese código no es un respaldo de 說說看.';render();return;}
  const base=new Set(BASE_BANK.map(entryId));const extra=d.bank.filter(e=>e&&e.hz&&e.es&&!base.has(entryId(e)));const have=new Set(fullBank().map(entryId));let n=0;
  extra.forEach(e=>{if(!have.has(entryId(e))){B.added.push({hz:e.hz,py:e.py,es:e.es,cat:e.cat||'Otro',ex:e.ex||'',topic:e.topic||'',src:'tú',status:e.status||'nuevo'});have.add(entryId(e));n++;}});
  (d.removed||[]).forEach(id=>{if(!B.removed.includes(id))B.removed.push(id);});
  d.bank.forEach(e=>{if(base.has(e.hz)&&e.status==='familiar')B.status[e.hz]='familiar';});
  let msg=`Vocabulario: ${n} entradas nuevas unidas; lo que ya tenías no cambió.`;
  if(mode==='all'&&d.prog){P=normProg(d.prog);P.updatedAt=Date.now();msg+=' Progreso restaurado desde el respaldo.';}
  rebuildIndex(fullBank());persist();UI.importMsg=msg;render();}

document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.tagName==='SELECT')return;const act=a.dataset.act;
  switch(act){
  case 'nav':stopSpeech();UI.screen=a.dataset.to;if(UI.screen==='home'&&SESSION&&SESSION.done)SESSION=null;UI.bankMsg=null;UI.importMsg=null;UI.confirmReset=false;render();window.scrollTo(0,0);break;

  case 'toggle-structs':UI.showStructs=!(UI.showStructs||UI.sel.type==='struct');if(!UI.showStructs&&UI.sel.type==='struct')UI.sel={type:'topic',id:1};render();break;
  case 'mode':P.prefs.mode=a.dataset.id;persist('prog');render();break;
  case 'sit':UI.sit=a.dataset.id;render();break;
  case 'method':P.prefs.method=a.dataset.id;persist('prog');render();break;
  case 'goal':P.prefs.goal=+a.dataset.n;persist('prog');render();break;
  case 'start':case 'new-session':startSession();break;
  case 'continue':{stopSpeech();if(SESSION&&!SESSION.done&&SESSION.n>0){UI.screen='play';nextExercise();break;}const l=P.prefs.last;UI.sel=l?l.sel:{type:'topic',id:1};P.prefs.mode=l?l.mode:'mixed';startSession();window.scrollTo(0,0);break;}
  case 'go':{const t=a.dataset.to;window.scrollTo(0,0);
    if(t==='learn'){UI.screen='sprint';render();}
    else if(t==='practice'){UI.screen='practice';render();}
    else if(t==='recognize'){const l=P.prefs.last;UI.sel=l?l.sel:{type:'all'};P.prefs.mode='listen';startSession();}
    else if(t==='review'){UI.sel={type:'review'};P.prefs.mode='mixed';startSession();}break;}
  case 'say':speak([a.dataset.hz]);break;
  case 'resume':UI.screen='play';nextExercise();break;
  case 'practice':UI.sel={type:'struct',id:a.dataset.id};P.prefs.mode='mixed';startSession();window.scrollTo(0,0);break;
  case 'play':if(UI.ex)speak(UI.ex.audio||(UI.ex.question&&UI.ex.question.toks)||[]);break;
  case 'reveal':UI.revealed++;render();break;
  case 'hint':UI.hints=Math.min(hintCount(UI.ex),UI.hints+1);render();break;
  case 'opt':if(UI.res)break;UI.pick=+a.dataset.i;render();break;
  case 'tile':{if(UI.res)break;const i=+a.dataset.i;UI.tiles.pool[i].used=true;UI.tiles.sel.push(i);UI.tSel=-1;render();break;}
  case 'btile':{if(UI.res)break;const k=+a.dataset.k;UI.tSel=UI.tSel===k?-1:k;render();break;}
  case 'tmove':{const T=UI.tiles,k=UI.tSel,d=+a.dataset.d,j=k+d;if(k<0||j<0||j>=T.sel.length)break;[T.sel[k],T.sel[j]]=[T.sel[j],T.sel[k]];UI.tSel=j;render();break;}
  case 'tdel':{const T=UI.tiles,k=UI.tSel;if(k<0)break;const pi=T.sel.splice(k,1)[0];T.pool[pi].used=false;UI.tSel=-1;render();break;}
  case 'tclear':UI.tiles.sel.forEach(pi=>UI.tiles.pool[pi].used=false);UI.tiles.sel=[];UI.tSel=-1;render();break;
  case 'check':{const el=document.getElementById('ans');if(el)UI.lastTyped=el.value;check();break;}
  case 'self':selfGrade(a.dataset.ok==='1');break;
  case 'fix-open':UI.fixOpen=true;render();break;
  case 'fix-close':UI.fixOpen=false;render();break;
  case 'fix':fixAction(a.dataset.k);break;
  case 'undo-fix':undoFix(+a.dataset.i);break;
  case 'copy-reports':copy(reportsText());break;
  case 'next':stopSpeech();nextExercise();window.scrollTo(0,0);break;
  case 'repeat':repeatExercise();break;
  case 'end':endSession();window.scrollTo(0,0);break;
  case 'repeat-fails':{const f=SESSION.fails.slice(-10);startSession(true);SESSION.queue=f;nextFromQueue();break;}

const I18N=(()=>{
  let EN={};let PAT=[];let WT=()=>null;
  const SKIP='script,style,textarea,code,.zh,.py,.pyopt,.es,.cue,.es2,[data-noi18n],.han,.g,.t,.bigpy,.revsub,.glyph,.vocab td:nth-child(3),.vocab td:nth-child(5)';
  const BOTH='p,li,h1,.instr,.verdict,.lead,.note,.foot';
  const lang=()=>(typeof P!=='undefined'&&P.prefs&&P.prefs.lang)||'en';
  function tr1(k){if(EN[k]!=null)return EN[k];for(const [re,f] of PAT){const m=k.match(re);if(m){const r=typeof f==='function'?f(...m):k.replace(re,f);if(r!=null)return r;}}return null;}
  function tr(t){const k=t.trim();if(!k)return null;let r=tr1(k);
    if(r==null){const parts=k.split(/(?<=[.!?？])\s+/);if(parts.length>1){let any=false;const o=parts.map(x=>{const y=tr1(x);if(y!=null){any=true;return y;}return x;});if(any)r=o.join(' ');}}
    if(r==null&&k.includes(' · ')){let any=false;const o=k.split(' · ').map(x=>{const y=tr1(x.trim())||WT(x.trim());if(y!=null){any=true;return y;}return x;});if(any)r=o.join(' · ');}
    if(r==null&&/[\u3400-\u9fff]/.test(k))r=WT(k);
    return r==null?null:t.replace(k,r);}
  function skip(n){const el=n.nodeType===1?n:n.parentElement;return !el||!!el.closest(SKIP);}
  function walk(root){if(lang()==='es'||!root)return;
    const both=lang()==='both';const boths=[];
    if(both&&root.querySelectorAll)root.querySelectorAll(BOTH).forEach(el=>{if(!el.dataset.i18b&&!el.closest('[data-noi18n]'))boths.push([el,el.textContent.trim()]);});
    const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];let n;while(n=tw.nextNode())nodes.push(n);
    if(root.nodeType===3)nodes.push(root);
    nodes.forEach(t=>{if(skip(t))return;const r=tr(t.data);if(r!=null&&r!==t.data)t.data=r;});
    if(root.querySelectorAll)root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>{['placeholder','aria-label','title'].forEach(a=>{const v=el.getAttribute(a);if(v){const r=tr(v);if(r!=null&&r!==v)el.setAttribute(a,r);}});});
    boths.forEach(([el,orig])=>{el.dataset.i18b='1';if(el.textContent.trim()!==orig&&orig){const s=document.createElement('span');s.className='es2';s.dataset.noi18n='1';s.textContent=orig;el.appendChild(s);}});}
  const obs=[];function observe(root){const mo=new MutationObserver(ms=>{if(lang()==='es')return;ms.forEach(m=>m.addedNodes.forEach(nd=>{if(nd.nodeType===1&&!nd.closest('[data-noi18n]'))walk(nd);else if(nd.nodeType===3&&!skip(nd)){const r=tr(nd.data);if(r!=null&&r!==nd.data)nd.data=r;}}));});mo.observe(root,{childList:true,subtree:true});obs.push(mo);walk(root);}
  function set(dict,pats,wt){EN=dict;PAT=pats;if(wt)WT=wt;}
  return {observe,walk,set,tr,lang};})();

    ${DATA_URL?'<p><a href="'+esc(DATA_URL)+'" target="_blank" rel="noopener">Ver los datos anónimos de todos</a></p>':''}<p class="muted small">Tu identificador anónimo: <code>${esc(st.uid)}</code>. Si quieres que se borren tus datos, comparte este código con quien administra la app.</p>
    <div class="row"><button class="ghost" data-tele="toggle">${on()?'Dejar de compartir':'Compartir datos anónimos'}</button>${on()?'<button class="link small" data-tele="show">Ver lo último que se envía</button>':''}<button class="ghost" data-tele="feedback">Enviar ideas</button>${st.survey!==true?'<button class="ghost" data-tele="survey">Responder encuesta (1 min)</button>':''}</div>
    <pre id="tele-q" hidden style="white-space:pre-wrap;font-size:.75rem;max-height:200px;overflow:auto;background:var(--soft);padding:8px;border-radius:8px"></pre></section>`;}
  function navBtn(){return TELEMETRY_URL?'<button class="ghost sm" data-tele="feedback">Ideas</button>':'';}
  function start(){if(!TELEMETRY_URL)return;if(st.consent===null)setTimeout(consentBox,600);else{visit();flush();
    if(st.consent===true&&!st.survey&&P.cnt.sessions>=1&&(st.asked||0)<2){st.asked=(st.asked||0)+1;save();setTimeout(surveyBox,800);}}}
  return {track,sessionEnd,sprintEnd,wordsAdded,correction,sessionAsk,card,navBtn,start};})();
window.TELE=TELE;
render();TELE.start();

</script>
