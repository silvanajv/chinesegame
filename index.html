<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>說說看 Mandarin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Figtree:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500&display=swap">
<style>
/* Layout: a study desk — one centered column; each exercise is a single card with the sentence set large in brush-kai, answers below, feedback slides in under it */
:root{
  --bg:#eef1f5; --card:#ffffff; --ink:#18202c; --muted:#5d6878; --line:#d8dee7; --soft:#f4f6f9;
  --accent:#2a55a3; --accent-ink:#ffffff; --accent-soft:#e3eaf7; --seal:#c23b2d;
  --good:#1d8a57; --good-bg:#e1f3e9; --warn:#a86a10; --warn-bg:#fbefd9; --bad:#c0392b; --bad-bg:#fbe3df;
  --f-zh:"LXGW WenKai TC","Kaiti TC","BiauKai","STKaiti","Noto Serif TC",serif;
  --f-ui:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-py:"Noto Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141b; --card:#181e28; --ink:#e6ebf2; --muted:#98a3b3; --line:#2a3342; --soft:#1f2632;
  --accent:#7ea4ec; --accent-ink:#0d1422; --accent-soft:#22304a; --seal:#ef6a58;
  --good:#4cc78a; --good-bg:#16352a; --warn:#e8b04f; --warn-bg:#3a2c12; --bad:#ff7a69; --bad-bg:#3d1d19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --card:#181e28; --ink:#e6ebf2; --muted:#98a3b3; --line:#2a3342; --soft:#1f2632;
  --accent:#7ea4ec; --accent-ink:#0d1422; --accent-soft:#22304a; --seal:#ef6a58;
  --good:#4cc78a; --good-bg:#16352a; --warn:#e8b04f; --warn-bg:#3a2c12; --bad:#ff7a69; --bad-bg:#3d1d19; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.zh{font-family:var(--f-zh)}
.py{font-family:var(--f-py);color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.85rem}
h1{font-size:1.5rem;margin:0 0 12px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1rem;margin:20px 0 8px;font-weight:700}
.lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
/* header */
.top{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand .seal{width:38px;height:38px;border-radius:8px;background:var(--seal);color:#fff;font-family:var(--f-zh);font-size:1.6rem;display:grid;place-items:center;line-height:1}
.brand b{display:block;font-family:var(--f-zh);font-size:1.25rem;line-height:1}
.brand small{color:var(--muted);font-size:.75rem}
.top nav{display:flex;flex-wrap:wrap;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.top nav button{border:0;background:none;border-radius:9px;padding:6px 12px;font-weight:600;font-size:.9rem}
.top nav button.on{background:var(--accent);color:var(--accent-ink)}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.8rem;flex-wrap:wrap}
.lvl{font-weight:700}
.xpbar{width:70px;height:6px;background:var(--line);border-radius:9px;overflow:hidden}.xpbar i{display:block;height:100%;background:var(--accent)}
.save{padding:2px 8px;border-radius:99px;font-weight:600}
.save.ok{background:var(--good-bg);color:var(--good)}.save.warn{background:var(--warn-bg);color:var(--warn)}.save.bad{background:var(--bad-bg);color:var(--bad)}.save.wait{background:var(--soft);color:var(--muted)}
@media (max-width:560px){.me{margin-left:0;width:100%}}
/* controls */
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 18px;font-weight:700}
.primary.big{padding:15px;font-size:1.1rem;width:100%}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:600}
.ghost:disabled,.primary:disabled{opacity:.45;cursor:default}
.sm{padding:5px 10px;font-size:.85rem;border-radius:9px}
.danger{background:var(--bad);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:700}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:600}
.chip b{color:var(--muted);margin-right:2px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.chip.on b{color:inherit;opacity:.8}
.chip.sm{padding:4px 12px}
.sits{align-items:center;margin-top:10px}
.structs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:10px}
.srow{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.srow.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.srow .zh{font-size:1.1rem}.srow .pat{font-size:.78rem;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:560px){.modes{grid-template-columns:1fr 1fr}}
.mode,.seg4 button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mode small,.seg4 small{color:var(--muted);font-size:.78rem}
.mode.on,.seg4 button.on{border-color:var(--accent);background:var(--accent-soft)}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.seg4{grid-template-columns:1fr 1fr}}
.home section{display:flex;flex-direction:column}
.resume{background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.note{color:var(--muted);font-size:.85rem}
.pill{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);letter-spacing:.02em}
.pill.l1{background:var(--warn-bg);color:var(--warn)}.pill.l2{background:var(--accent-soft);color:var(--accent)}.pill.l3{background:var(--good-bg);color:var(--good)}.pill.new{background:var(--warn-bg);color:var(--warn)}
/* play */
.ptop{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.cnt,.xp{font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.ex{display:flex;flex-direction:column;gap:14px}
.exhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.kind{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--seal)}
.stchip{font-family:var(--f-zh);font-size:1rem;display:flex;gap:6px;align-items:center}
.instr{margin:0;font-size:1.05rem}
.audio{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--soft);border-radius:12px;padding:10px 12px}
.audio .play{background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:10px 18px;font-weight:700}
.audio label{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.audio select,.msel select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 6px;max-width:220px}
.warn{color:var(--warn);font-size:.85rem;margin:0}
.reveal{min-height:1em}
.zh.big,.big .zh{font-size:clamp(1.6rem,6vw,2.2rem);line-height:1.25}
.big1{font-size:4rem;line-height:1.1}
.qtext,.basesent{display:flex;flex-direction:column;gap:2px}
.cue{font-size:1.15rem;font-weight:600;background:var(--soft);border-radius:12px;padding:10px 14px}
.pattern{font-family:var(--f-zh);font-size:1.1rem;color:var(--accent);border:1px dashed var(--accent);border-radius:10px;padding:6px 12px;align-self:flex-start}
.changes{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.scr{display:flex;flex-wrap:wrap;gap:8px}.scr span{font-size:1.4rem;background:var(--soft);border-radius:8px;padding:2px 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.es,.opts.desc{grid-template-columns:1fr}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{position:relative;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 12px 12px 38px;min-height:56px}
.opt .zh{font-size:1.45rem}
.opt .k{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:.75rem;color:var(--muted);font-family:var(--f-py)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.build{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.built{flex:1;min-width:180px;min-height:58px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ph{color:var(--muted);font-size:.9rem;padding:0 6px}
.tile{background:var(--card);border:1px solid var(--line);border-bottom-width:3px;border-radius:10px;padding:4px 12px;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:44px}
.tile .zh{font-size:1.5rem}.tile small{font-family:var(--f-py);font-size:.7rem;color:var(--muted)}
.tile.focus{border-color:var(--accent);background:var(--accent-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tctl{display:flex;gap:6px;flex-wrap:wrap}
.ans{flex:1;min-width:200px;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--card);font-size:1.1rem}
.ans.zh{font-size:1.4rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.msel{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center;margin-right:auto}
.hints{margin:0;padding:10px 10px 10px 30px;background:var(--warn-bg);border-radius:12px;display:flex;flex-direction:column;gap:4px}
.hints li{font-size:.95rem}
.fb{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.fb.ok{background:var(--good-bg);border-color:transparent}.fb.partial,.fb.review{background:var(--warn-bg);border-color:transparent}.fb.bad{background:var(--bad-bg);border-color:transparent}
.verdict{font-weight:800;font-size:1.1rem}
.fb.ok .verdict{color:var(--good)}.fb.partial .verdict,.fb.review .verdict{color:var(--warn)}.fb.bad .verdict{color:var(--bad)}
.gain{font-size:.8rem;font-weight:700;color:var(--muted);margin-left:6px}
.ach-new{font-weight:700}
.sent{background:var(--card);border-radius:10px;padding:8px 12px}
.sent .zh.big{font-size:1.5rem}.sent .es{font-size:.95rem}
.yours .zh{font-size:1.3rem}
.tags{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--card);margin-right:4px}
.t-gram{color:var(--bad)}.t-vocab{color:var(--accent)}.t-char{color:var(--seal)}.t-py{color:var(--warn)}.t-nat{color:var(--warn)}.t-comp{color:var(--muted)}.t-info{color:var(--muted)}
.more{font-size:.95rem}.more .zh{font-size:1.2rem}
.vocabfb{display:flex;flex-direction:column;gap:4px}
/* summary/bank/progress */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.kpis div{background:var(--soft);border-radius:12px;padding:12px}.kpis b{display:block;font-size:1.6rem;font-variant-numeric:tabular-nums}.kpis span{font-size:.78rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:560px){.two{grid-template-columns:1fr}}
.two ul,.summary ul{margin:0;padding-left:20px}
.focus{background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin:0}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.zh.big{font-size:1.5rem}
.tbl tr.hl td{background:var(--warn-bg)}
.addf{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.addf input,.addf select,textarea,.filters input,.filters select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--card);min-width:0;width:100%}
@media (max-width:560px){.addf{grid-template-columns:1fr}}
details{margin-top:12px}summary{cursor:pointer;font-weight:600}
textarea{display:block;margin:8px 0;font-family:var(--f-py)}
.confirm{margin-top:12px;background:var(--good-bg);border-radius:12px;padding:10px 14px;line-height:1.6}
.bhead{display:flex;flex-direction:column;gap:8px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:8px}@media (max-width:560px){.filters{grid-template-columns:1fr}}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ach{border:1px dashed var(--line);border-radius:12px;padding:10px;opacity:.55;display:flex;flex-direction:column}
.ach.on{opacity:1;border-style:solid;border-color:var(--good);background:var(--good-bg)}.ach small{color:var(--muted);font-size:.78rem}
.chk{display:flex;gap:8px;align-items:center}
.fixp{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--card);border-radius:12px;padding:12px}.fixp small{margin:-2px 0 6px}.fixp textarea{width:100%}
.flash{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-weight:600;z-index:20;max-width:90vw}
/* home */
.home2{gap:22px;padding-bottom:20px}
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-block:8px 4px}
.hello{font-size:2.6rem;line-height:1;color:var(--seal)}
.hero h1{font-size:1.7rem;margin:4px 0 0}
.hero p{margin:0}
.streak{font-weight:700;font-size:.9rem;background:var(--warn-bg);color:var(--warn);padding:3px 10px;border-radius:99px}
.hero .primary.big{margin-top:10px}
.progress{display:flex;flex-direction:column;gap:8px}
.lvlrow{display:flex;justify-content:space-between;align-items:baseline}.lvlrow b{font-size:1.5rem}.lvlrow span{color:var(--muted);font-variant-numeric:tabular-nums}
.progress .bar{height:10px;flex:none}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;border-top:1px solid var(--line);padding-top:12px}
.minis.stats6{grid-template-columns:repeat(3,1fr);row-gap:14px;margin-top:0;border-top:0;padding-top:4px}
.minis b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}.minis b small{font-size:.8rem;color:var(--muted);font-weight:600}.minis span{font-size:.75rem;color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.acts{grid-template-columns:1fr}}
.act{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.act:hover{border-color:var(--accent)}
.actg{flex:none;width:56px;height:56px;display:grid;place-items:center;font-size:2rem;border:1.5px solid var(--accent);border-radius:10px;color:var(--accent);background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.actt{display:flex;flex-direction:column;gap:1px;min-width:0}.actt b{font-size:1.05rem}.actt small{color:var(--muted);font-size:.85rem}.actt em{font-style:normal;font-size:.75rem;color:var(--accent);font-weight:600;margin-top:3px}
.cont{display:flex;flex-direction:column;gap:12px}
.controw{display:flex;gap:16px;align-items:center}
.glyphbox{flex:none;width:84px;height:84px;display:grid;place-items:center;font-size:3.4rem;border:2px solid var(--accent);border-radius:12px;background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.contt{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;align-items:flex-start}.contt b{font-size:1.1rem}
.due{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;font-weight:600}
.back{align-self:flex-start;text-decoration:none}
.ptitle{margin:4px 0 0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:130px;align-items:end;margin-bottom:6px}
.wcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.wcol i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px}
.wcol small{color:var(--muted);font-size:.75rem}.wval{font-size:.75rem;font-variant-numeric:tabular-nums;color:var(--muted)}
/* practice list, cta, cards */
.tlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.trow{display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px}
.trow:last-child{border-bottom:0}.trow:hover{background:var(--soft)}
.trow.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.tnum{flex:none;width:26px;height:26px;border-radius:99px;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.trow.on .tnum{background:var(--accent);color:var(--accent-ink)}
.ttxt{display:flex;flex-direction:column;min-width:0}.ttxt small{color:var(--muted);font-size:.8rem;font-family:var(--f-zh)}
.cta{display:flex;flex-direction:column;align-items:stretch;gap:6px;text-align:center}.cta p{margin:0;font-weight:600}
.top{justify-content:flex-end;padding-block:10px 0}
.cardfull{display:flex;gap:16px;align-items:flex-start;background:var(--card);border-radius:12px;padding:12px}
.cardfull .contt{gap:4px}.cardfull .lbl{margin-right:4px}
.why{margin:0;font-weight:600}
.pybig{font-size:1.5rem;color:var(--ink);font-family:var(--f-py)}
.bigplay{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:14px 22px;font-weight:700;font-size:1.05rem}
.pyopt{font-family:var(--f-py);font-size:1.4rem}
.opts.comp .zh,.opts.word .zh{font-size:1.6rem}
.es2{display:block;font-size:.85em;color:var(--muted);font-weight:400;margin-top:2px}
.addf select{min-width:0}
/* guided day */
.today{display:flex;flex-direction:column;gap:12px;border:2px solid var(--accent)}
.todayhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.todayhead h2{margin:2px 0 4px;font-size:1.3rem}.todayhead p{margin:0}
.ring{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring b{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.daysteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.daysteps li{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:12px;border:1px solid var(--line)}
.daysteps li.cur{border-color:var(--accent);background:var(--accent-soft)}.daysteps li.done{opacity:.6}
.dsg{flex:none;width:38px;height:38px;display:grid;place-items:center;font-size:1.4rem;border-radius:9px;background:var(--soft);color:var(--accent)}
.dsbtn{all:unset;display:flex;gap:12px;align-items:flex-start;width:100%;cursor:pointer}.dsbtn:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:8px}.daysteps li:has(.dsbtn):hover{border-color:var(--accent)}
.daysteps li.done .dsg{background:var(--good-bg);color:var(--good);font-family:var(--f-ui)}
.dst{display:flex;flex-direction:column;gap:1px;min-width:0}.dst small{color:var(--muted);font-size:.85rem}.dst em{font-style:normal;font-size:.75rem;color:var(--accent);font-weight:600}
.trouble .tchips{display:flex;flex-wrap:wrap;gap:6px}.tchip{display:flex;flex-direction:column;align-items:center;border:1px solid var(--bad);border-radius:10px;padding:4px 10px;background:var(--bad-bg)}.tchip .zh{font-size:1.5rem}.tchip small{font-size:.7rem;color:var(--muted)}
.trouble{display:flex;flex-direction:column;gap:10px}.trouble p{margin:0}
.sprintcard{display:flex;gap:14px;align-items:center}.sprintcard .actt{flex:1}
.sprintbig{display:flex;flex-direction:column;gap:14px;padding:24px;border:2px solid var(--seal);background:linear-gradient(135deg,var(--card) 55%,var(--bad-bg))}
.sbtop{display:flex;gap:18px;align-items:center}.sbglyph{flex:none;width:88px;height:88px;display:grid;place-items:center;font-size:3.6rem;border-radius:16px;background:var(--seal);color:#fff;line-height:1}
.sbtxt h2{margin:2px 0 4px;font-size:1.7rem;font-weight:800}.sbtxt p{margin:0}.sbmeta{display:flex;gap:6px;flex-wrap:wrap}
.sprintbig .primary.big{background:var(--seal);color:#fff}
.exb{background:var(--card);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}.exb .exs{font-size:1.6rem;line-height:1.3}.exb .exen{font-weight:600}.exb button{margin-top:4px}
.stepcard{display:flex;flex-direction:column;gap:12px}.stephead{display:flex;gap:14px;align-items:center}.stephead h1{margin:0}.stephead p{margin:2px 0 0}
.why2{margin:0;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:.92rem}
.steps-mini{display:flex;gap:4px;flex:1}.steps-mini i{flex:1;height:8px;border-radius:99px;background:var(--line)}.steps-mini i.done{background:var(--good)}.steps-mini i.cur{background:var(--accent)}
.timer{font-variant-numeric:tabular-nums;font-size:.85rem;font-weight:700;color:var(--accent);white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;font-weight:600}.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.grp{display:flex;flex-direction:column;gap:10px}.grphead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grphead b{margin-right:auto}
.grpchars{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.gc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);border-radius:12px;padding:10px}.gc .zh{font-size:2.4rem;line-height:1.1}.gc small{font-size:.78rem}.gc.tr{border-color:var(--bad);background:var(--bad-bg)}
.ghost.big{padding:14px;font-size:1.05rem;width:100%}
/* bottom nav */
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bnav button{flex:1;max-width:150px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px;border-radius:10px;color:var(--muted)}
.bnav button .zh{font-size:1.3rem;line-height:1.2}.bnav button small{font-size:.7rem;font-weight:600}
.bnav button.on{color:var(--accent);background:var(--accent-soft)}
code{font-family:var(--f-py);background:var(--soft);padding:1px 5px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
